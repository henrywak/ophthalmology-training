<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="utf-8">
<title>Ophthalmology Technician Training</title>
<style>
  /* Committed light palette - alabaster base, black headings, graphite text, blue accent */
  :root{
    --bg:#DFDFDF; --surface:#FFFFFF; --surface-2:#EBEBEB;
    --ink:#000000; --ink-2:#343434; --muted:#565656; --faint:#767676;
    --line:#C9C9C9; --line-2:#BCBCBC;
    --accent:#5386E4; --accent-ink:#2F5FC0; --accent-soft:#E7EEFC; --accent-2:#7AA3EC;
    --warn:#8A5310; --warn-soft:#F2E7D2; --warn-line:#DFCBA4;
    --serif:ui-serif,Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --measure:64ch; --page:720px;
    --dur:.42s; --ease:cubic-bezier(.22,.61,.36,1);
    --shadow:0 1px 2px rgba(20,20,20,.06),0 10px 30px rgba(20,20,20,.10);
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-size:17px; line-height:1.7;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  ::selection{background:var(--accent-soft); color:var(--accent-ink)}
  a{color:var(--accent-ink); text-decoration:none}

  /* ---------- top bar ---------- */
  .top{
    position:sticky; top:0; z-index:20;
    backdrop-filter:saturate(1.1) blur(8px);
    background:color-mix(in srgb,var(--bg) 82%,transparent);
    border-bottom:1px solid var(--line);
  }
  .top__in{
    max-width:var(--page); margin:0 auto; padding:14px 24px;
    display:flex; align-items:center; gap:14px;
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:600; letter-spacing:-.01em; color:var(--ink)}
  .brand__dot{width:22px;height:22px;border-radius:6px;background:
     radial-gradient(circle at 50% 50%,var(--surface) 0 22%,var(--accent) 24% 46%,var(--surface) 48% 60%,var(--accent) 62% 100%);
     box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent);flex:none}
  .brand__txt{font-size:14.5px}
  .top__spacer{flex:1}
  .link-home{
    font-size:13.5px; color:var(--muted); border:1px solid var(--line-2);
    padding:6px 12px; border-radius:999px; transition:color .2s,border-color .2s,background .2s; cursor:pointer;
  }
  .link-home:hover{color:var(--accent-ink); border-color:var(--accent); background:var(--accent-soft)}
  .link-home[hidden]{display:none}

  /* ---------- stage ---------- */
  main{max-width:var(--page); margin:0 auto; padding:0 24px}
  #stage{
    padding:52px 0 40px;
    transition:opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
  }
  #stage.is-exiting{opacity:0; transform:translateY(-10px)}
  #stage.is-entering{opacity:0; transform:translateY(14px); transition:none}
  .has-bar #stage{padding-bottom:132px}

  .eyebrow{
    font-family:var(--mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--accent-ink); margin:0 0 14px; font-weight:600;
  }
  h1,h2,h3{letter-spacing:-.018em; text-wrap:balance}
  .display{font-family:var(--serif); font-weight:600; line-height:1.12; letter-spacing:-.02em; color:var(--ink); margin:0}

  .prose{max-width:var(--measure)}
  .prose p{margin:0 0 1.05em; color:var(--ink-2)}
  .prose .lead{font-size:1.16em; line-height:1.6; color:var(--ink); margin-bottom:1.1em}
  .prose h3{font-family:var(--serif); font-weight:600; font-size:1.28em; margin:2em 0 .5em; color:var(--ink)}
  .prose h4{font-size:.86em; text-transform:uppercase; letter-spacing:.08em; color:var(--faint);
     font-weight:700; margin:1.9em 0 .6em}
  .prose ul,.prose ol{margin:0 0 1.15em; padding-left:1.35em; color:var(--ink-2)}
  .prose li{margin:.34em 0; padding-left:.15em}
  .prose ol{counter-reset:step; list-style:none; padding-left:0}
  .prose ol>li{position:relative; padding-left:2.4em; margin:.5em 0}
  .prose ol>li::before{
    counter-increment:step; content:counter(step);
    position:absolute; left:0; top:.06em;
    width:1.7em; height:1.7em; border-radius:50%;
    background:var(--accent-soft); color:var(--accent-ink);
    font-family:var(--mono); font-size:.72em; font-weight:600;
    display:flex; align-items:center; justify-content:center;
  }
  .prose blockquote{
    margin:.4em 0 1.15em; padding:.5em 0 .5em 1.1em; border-left:3px solid var(--line-2);
    color:var(--muted); font-style:italic;
  }
  .prose .q-good{border-left-color:var(--accent)}

  /* callouts */
  .callout{
    border:1px solid var(--line-2); background:var(--surface-2);
    border-radius:14px; padding:20px 22px; margin:1.8em 0; max-width:var(--measure);
  }
  .callout__title{
    margin:0 0 .55em; font-size:12px; letter-spacing:.1em; text-transform:uppercase;
    font-weight:700; color:var(--faint); font-family:var(--sans);
  }
  .callout ul{margin:0; padding-left:1.2em}
  .callout li{margin:.3em 0}
  .callout--key{border-color:color-mix(in srgb,var(--accent) 26%,var(--line-2)); background:var(--accent-soft)}
  .callout--key .callout__title{color:var(--accent-ink)}
  .callout--key li{color:var(--ink-2)}
  .callout--warn{border-color:var(--warn-line); background:var(--warn-soft)}
  .callout--warn .callout__title{color:var(--warn)}
  .callout--warn li{color:var(--ink-2)}
  .callout--warn p{margin:0 0 .5em; color:var(--ink-2)}
  .callout--check{border-color:var(--line-2); background:var(--surface)}
  .callout--check .callout__title{color:var(--accent-ink)}
  .callout--check li{color:var(--ink-2)}
  .callout--eg{border-color:var(--line-2); background:var(--surface-2)}
  .callout--eg .callout__title{color:var(--muted)}
  .callout--eg p{margin:0; color:var(--ink-2); font-variant-numeric:tabular-nums}

  /* ---------- Module 1 heading levels ---------- */
  .prose .m-sec{font-family:var(--serif); font-weight:600; font-size:1.32em; color:var(--ink);
     margin:2.1em 0 .55em; letter-spacing:-.01em; padding-bottom:.3em; border-bottom:1px solid var(--line)}
  .prose .m-sub{font-family:var(--sans); font-weight:700; font-size:1.06em; color:var(--ink); margin:1.7em 0 .5em}
  .prose .m-label{font-size:.78em; text-transform:uppercase; letter-spacing:.09em; color:var(--faint);
     font-weight:700; margin:1.8em 0 .5em}
  .prose .m-sub + ul{margin-top:.2em}

  /* ---------- tables ---------- */
  .tbl{overflow-x:auto; margin:1.3em 0; max-width:var(--measure);
     border:1px solid var(--line); border-radius:12px; background:var(--surface)}
  .tbl table{border-collapse:collapse; width:100%; font-size:.95em}
  .tbl td{padding:11px 15px; border-bottom:1px solid var(--line); color:var(--ink-2); vertical-align:top; text-align:left}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tr:first-child td{background:var(--surface-2); color:var(--ink); font-weight:600; font-size:.82em;
     text-transform:uppercase; letter-spacing:.05em; white-space:nowrap}
  .tbl td strong{color:var(--ink); font-weight:600}

  /* ---------- Module 2: TAR assessment ---------- */
  .tar{border:1px solid var(--line-2); border-radius:14px; background:var(--surface);
     margin:1.4em 0; overflow:hidden; max-width:var(--measure); box-shadow:var(--shadow)}
  .tar__head{padding:11px 18px; background:var(--surface-2); border-bottom:1px solid var(--line);
     font-family:var(--mono); font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
  .tar__body{padding:10px 18px}
  .tar__row{display:flex; gap:14px; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--line);
     font-size:.95em}
  .tar__row:last-child{border-bottom:none}
  .tar__code{font-family:var(--mono); font-weight:600; color:var(--accent-ink);
     min-width:5.4em; font-variant-numeric:tabular-nums; flex:none}
  .tar__desc{color:var(--ink-2)}
  .q{margin:1.4em 0 1.1em}
  .q__stem{font-weight:600; color:var(--ink); margin:0 0 .7em}
  .opt{display:block; width:100%; text-align:left; font-family:var(--sans); font-size:.95em;
     color:var(--ink-2); background:var(--surface); border:1px solid var(--line-2); border-radius:11px;
     padding:11px 15px; margin:.45em 0; cursor:pointer;
     transition:border-color .18s var(--ease), background .18s var(--ease)}
  .opt:hover:not([disabled]){border-color:var(--accent); background:var(--accent-soft)}
  .opt[disabled]{cursor:default}
  .opt[data-state="correct"]{border-color:#3F8F5B; background:#E6F4EA; color:#1E5631; font-weight:600}
  .opt[data-state="wrong"]{border-color:#C0632F; background:#F6E7DD; color:#8A3B10}
  .q__fb{margin:.55em 0 0; font-size:.9em; color:var(--muted); min-height:1.1em}
  .q__fb.ok{color:#1E5631; font-weight:600}
  .q__fb.no{color:#8A3B10}
  details.reveal{margin:.6em 0 1.6em; border:1px solid var(--line-2); border-radius:12px;
     background:var(--surface-2); padding:2px 18px}
  details.reveal>summary{cursor:pointer; padding:13px 0; font-weight:600; color:var(--accent-ink);
     font-size:.92em; list-style:none; user-select:none}
  details.reveal>summary::-webkit-details-marker{display:none}
  details.reveal>summary::before{content:"▸\00a0"; color:var(--accent)}
  details.reveal[open]>summary::before{content:"▾\00a0"}
  details.reveal[open]{padding-bottom:12px}
  details.reveal .m-sub:first-of-type{margin-top:.2em}

  /* ---------- hero screens (intro / complete) ---------- */
  .hero{max-width:600px; margin:22px auto; text-align:center; padding:26px 0}
  .hero .eyebrow{margin-bottom:18px}
  .hero .display{font-size:clamp(2.1rem,6vw,3.1rem)}
  .hero__sub{font-size:1.18rem; color:var(--muted); margin:20px auto 0; max-width:46ch; line-height:1.55}
  .hero__meta{margin-top:26px; color:var(--faint); font-size:14px; font-family:var(--mono); letter-spacing:.04em}
  .hero .btn{margin-top:34px}

  .medal{
    width:74px;height:74px;border-radius:50%; margin:0 auto 6px;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft); color:var(--accent-ink);
    box-shadow:0 0 0 8px color-mix(in srgb,var(--accent) 8%,transparent);
  }
  .medal svg{width:34px;height:34px}

  /* section title block */
  .titleblock{margin-bottom:30px}
  .titleblock .display{font-size:clamp(1.85rem,4.4vw,2.5rem)}
  .titleblock .topic{margin:14px 0 0; color:var(--muted); font-size:1.1rem; max-width:var(--measure)}

  /* ---------- buttons ---------- */
  .btn{
    font-family:var(--sans); font-size:15px; font-weight:600; cursor:pointer;
    border:1px solid transparent; border-radius:999px; padding:13px 26px;
    background:var(--accent); color:#fff; transition:transform .16s var(--ease),background .2s,box-shadow .2s;
    box-shadow:0 1px 2px rgba(16,32,30,.14); display:inline-flex; align-items:center; gap:9px;
  }
  .btn:hover{background:var(--accent-ink); transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn--ghost{background:transparent; color:var(--muted); box-shadow:none; border-color:var(--line-2)}
  .btn--ghost:hover{background:var(--surface-2); color:var(--ink); border-color:var(--line-2); transform:none}
  .btn svg{width:16px;height:16px}
  .btn[disabled]{opacity:.45; pointer-events:none}

  /* ---------- course home ---------- */
  .home-head{margin-bottom:34px; max-width:var(--measure)}
  .home-head .display{font-size:clamp(1.9rem,4.5vw,2.6rem)}
  .home-head p{color:var(--muted); margin:14px 0 0; font-size:1.08rem}
  .mods{display:flex; flex-direction:column; gap:16px; max-width:640px}
  .mod{
    text-align:left; width:100%; background:var(--surface); border:1px solid var(--line);
    border-radius:16px; padding:22px 24px; cursor:pointer; color:inherit;
    display:flex; gap:20px; align-items:flex-start;
    transition:border-color .22s,box-shadow .22s,transform .16s var(--ease);
    box-shadow:var(--shadow);
  }
  .mod:hover{border-color:var(--accent); transform:translateY(-2px)}
  .mod__num{
    font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.08em;
    color:var(--accent-ink); background:var(--accent-soft); border-radius:8px;
    padding:8px 10px; flex:none; margin-top:2px;
  }
  .mod__body{flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start}
  .mod__title{font-family:var(--serif); font-size:1.34rem; font-weight:600; margin:0 0 5px; color:var(--ink); letter-spacing:-.01em}
  .mod__desc{color:var(--muted); font-size:.98rem; margin:0 0 12px}
  .mod__meta{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--faint); flex-wrap:wrap}
  .pill{font-size:12px; font-weight:600; padding:4px 11px; border-radius:999px; letter-spacing:.02em}
  .pill--ready{background:var(--accent-soft); color:var(--accent-ink)}
  .pill--soon{background:var(--surface-2); color:var(--faint); border:1px solid var(--line-2)}
  .pill--done{background:var(--accent); color:#fff}
  .mod--soon{cursor:default; opacity:.72}
  .mod--soon:hover{border-color:var(--line); transform:none}
  .mod__arrow{color:var(--faint); flex:none; align-self:center; transition:transform .2s,color .2s}
  .mod:hover .mod__arrow{color:var(--accent); transform:translateX(3px)}
  .mod--soon .mod__arrow{display:none}

  /* lesson list on overview */
  .llist{list-style:none; margin:26px 0 0; padding:0; max-width:600px; counter-reset:l}
  .llist li{
    display:flex; align-items:center; gap:14px; padding:13px 4px;
    border-bottom:1px solid var(--line);
  }
  .llist li:first-child{border-top:1px solid var(--line)}
  .lnum{
    counter-increment:l; font-family:var(--mono); font-size:12px; color:var(--faint);
    width:26px; flex:none; text-align:right;
  }
  .ltitle{color:var(--ink-2); font-size:1.02rem}
  .lcheck{margin-left:auto; color:var(--accent); display:flex}
  .lcheck svg{width:18px;height:18px;display:block}
  .llock{margin-left:auto; color:var(--faint); display:flex}
  .llock svg{width:15px;height:15px;display:block}
  .llist li.is-open{cursor:pointer; transition:padding-left .18s var(--ease), border-color .18s}
  .llist li.is-open:hover{padding-left:9px}
  .llist li.is-open:hover .ltitle{color:var(--accent-ink)}
  .llist li.is-open:hover .lcheck{color:var(--accent-ink)}
  .llist li.is-open:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:8px}
  .llist li.is-locked .ltitle{color:var(--faint)}
  .llist li.is-locked .lnum{color:var(--line-2)}

  .what{display:grid; gap:18px; max-width:var(--measure); margin-top:8px}
  .what__row{display:flex; gap:16px; align-items:flex-start}
  .what__ic{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent-ink);
     display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
  .what__ic svg{width:16px;height:16px}
  .what__t{font-weight:600;color:var(--ink);margin:0 0 3px;font-size:1.02rem}
  .what__d{color:var(--muted);margin:0;font-size:.97rem}

  /* ---------- bottom bar ---------- */
  .bar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:color-mix(in srgb,var(--bg) 86%,transparent);
    backdrop-filter:saturate(1.1) blur(10px);
    border-top:1px solid var(--line);
    transform:translateY(100%); transition:transform var(--dur) var(--ease);
  }
  .has-bar .bar{transform:translateY(0)}
  .bar__in{
    max-width:var(--page); margin:0 auto; padding:14px 24px;
    display:flex; align-items:center; gap:16px;
  }
  .bar__meta{flex:1; min-width:0; text-align:center}
  .bar__actions{display:flex; gap:10px; align-items:center; flex:none}
  .bar__label{font-size:12.5px; font-family:var(--mono); letter-spacing:.05em; color:var(--muted); display:block}
  .bar__pct{font-size:12.5px; color:var(--faint); font-variant-numeric:tabular-nums}
  .bar .btn{padding:11px 20px; font-size:14px}
  .bar__track{height:4px; background:var(--line); overflow:hidden}
  .bar__fill{
    height:100%; width:0%;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    transition:width .55s var(--ease); border-radius:0 3px 3px 0;
  }

  @media (max-width:560px){
    body{font-size:16px}
    #stage{padding-top:38px}
    .bar__in{padding:11px 16px; gap:9px}
    .bar .btn{padding:10px 13px; font-size:13px}
    .bar__actions{gap:7px}
    .bar__label{font-size:11px}
    .bar__pct{display:none}
    #btnOverview{padding-left:11px;padding-right:11px}
    main,.top__in,.bar__in{padding-left:18px;padding-right:18px}
    .mod{padding:18px}
  }

  /* ---------- anatomy diagram + in-page nav ---------- */
  .prose .m-sec, .prose .m-sub{ scroll-margin-top:84px; }
  .eyefig{
    margin:1.6em 0 2em; max-width:var(--measure);
    border:1px solid var(--line); border-radius:16px; background:var(--surface);
    padding:18px 18px 12px; box-shadow:var(--shadow); overflow-x:auto;
  }
  .eyefig svg{ width:100%; height:auto; display:block; }
  .eyefig__ext{ max-width:270px; margin:0 auto 2px; }
  .eyefig__cross{ margin-top:4px; border-top:1px solid var(--line); padding-top:10px; }
  @media (max-width:560px){ .eyefig svg{ min-width:520px; } }
  .eyefig text{ font-family:var(--sans); }
  .eyefig .cap{ fill:var(--faint); font-weight:600; letter-spacing:.02em; }
  .eyefig figcaption{
    margin-top:6px; color:var(--faint); font-size:.82rem; text-align:center;
  }
  .eyefig figcaption strong{ color:var(--muted); font-weight:600; }
  /* clickable labels inside the svg */
  .eyelbl{ cursor:pointer; }
  .eyelbl text{ fill:var(--accent-ink); font-family:var(--sans); font-weight:600;
     text-decoration:underline; text-decoration-color:color-mix(in srgb,var(--accent) 45%,transparent);
     text-underline-offset:2px; }
  .eyelbl:hover text, .eyelbl:focus-visible text{ fill:var(--accent); }
  .eyelbl .lead-line{ stroke:var(--faint); }
  .eyelbl .dot{ fill:var(--accent); }
  .eyelbl:hover .lead-line, .eyelbl:focus-visible .lead-line{ stroke:var(--accent); }
  .eyelbl:focus-visible{ outline:none; }
  .eyelbl:focus-visible text{ text-decoration-color:var(--accent); }

  /* flash highlight when jumping to a structure */
  .prose .flash{ animation:flashbg 1.7s var(--ease); border-radius:8px; }
  @keyframes flashbg{
    0%{ background:var(--accent-soft); box-shadow:0 0 0 6px var(--accent-soft); }
    100%{ background:transparent; box-shadow:0 0 0 6px transparent; }
  }

  /* back to top */
  .totop-wrap{ margin:34px 0 4px; padding-top:22px; border-top:1px solid var(--line); }
  .floatTop{
    position:fixed; right:22px; bottom:96px; z-index:29;
    width:44px; height:44px; border-radius:50%; border:1px solid var(--line-2);
    background:var(--surface); color:var(--accent-ink); cursor:pointer;
    box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center;
    opacity:0; transform:translateY(8px); pointer-events:none;
    transition:opacity .25s var(--ease), transform .25s var(--ease), background .2s;
  }
  .floatTop svg{ width:20px; height:20px; }
  .floatTop.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .floatTop:hover{ background:var(--accent-soft); border-color:var(--accent); }
  @media (max-width:560px){ .floatTop{ right:14px; bottom:84px; } }

  @media (prefers-reduced-motion:reduce){
    #stage,#stage.is-exiting,#stage.is-entering{transition:none!important; transform:none!important}
    .bar,.bar__fill,.btn,.mod,.floatTop{transition:none!important}
    .prose .flash{animation:none!important}
    *{scroll-behavior:auto!important}
  }
</style>
</head>
<body>
<header class="top">
  <div class="top__in">
    <span class="brand"><span class="brand__dot" aria-hidden="true"></span><span class="brand__txt">Ophthalmology Technician Training</span></span>
    <span class="top__spacer"></span>
    <button class="link-home" data-nav="home" hidden>Course home</button>
  </div>
</header>

<main>
  <div id="stage" aria-live="polite"></div>
</main>

<footer class="bar" aria-label="Lesson progress">
  <div class="bar__in">
    <button class="btn btn--ghost" id="btnOverview">Overview</button>
    <div class="bar__meta">
      <span class="bar__label" id="barLabel">Overview</span>
      <span class="bar__pct" id="barPct">0% complete</span>
    </div>
    <div class="bar__actions">
      <button class="btn btn--ghost" id="btnBack">Back</button>
      <button class="btn" id="btnNext">Next</button>
    </div>
  </div>

<script>
(function(){
  "use strict";

  /* ---------- tiny html helpers ---------- */
  var UL = function(a){return "<ul>"+a.map(function(x){return "<li>"+x+"</li>";}).join("")+"</ul>";};
  var OL = function(a){return "<ol>"+a.map(function(x){return "<li>"+x+"</li>";}).join("")+"</ol>";};
  var KT = function(a){return '<div class="callout callout--key"><h4 class="callout__title">Key takeaways</h4>'+UL(a)+'</div>';};
  var WARN = function(t,inner){return '<div class="callout callout--warn"><h4 class="callout__title">'+t+'</h4>'+inner+'</div>';};
  var MATRIX = function(cc,rows){return '<p class="m-sub">CC: '+cc+'</p><div class="tbl"><table>\n<tr>\n<td>HPI field</td>\n<td>What to chart</td>\n</tr>'+rows.map(function(r){return '\n<tr>\n<td><strong>'+r[0]+'</strong></td>\n<td>'+r[1]+'</td>\n</tr>';}).join("")+'\n</table></div>';};

  /* =========================================================
     CONTENT  &mdash;  edit here to update lessons
     Each lesson: { num, title, topic, body(HTML string) }
     ========================================================= */
  var MODULES = [
    {
      id:"m0", label:"Module 0", title:"Welcome & Orientation",
      status:"available",
      desc:"The clinic environment, the technician's role, and where you fit in the patient's visit.",
      overview:
        '<p class="lead">Welcome to the ophthalmology technician training program.</p>'+
        '<p>This module introduces the clinic environment, the role of the ophthalmology technician, and the technician&rsquo;s place within the overall patient care process. Before learning individual clinical skills, trainees should understand how the clinic operates, how technicians support physicians and patients, and why accuracy, professionalism, privacy, and communication are essential in every encounter.</p>'+
        '<p>The ophthalmology technician is often one of the first clinical team members to interact with a patient. The information collected and the testing completed during the technician workup help prepare the physician for an efficient and informed examination.</p>'+
        '<p>Although technicians perform many clinical and administrative tasks, they must always work within their assigned responsibilities and follow clinic-specific and physician-specific protocol.</p>'+
        '<div class="callout callout--key"><h4 class="callout__title">Learning objectives</h4>'+
        UL([
          "Describe the role of an ophthalmology technician",
          "Explain how technicians contribute to patient care",
          "Identify where technicians fit within the overall clinical workflow",
          "Describe the basic steps of a patient&rsquo;s visit",
          "Recognize the importance of following physician and clinic-specific protocols",
          "Explain the basic expectations for privacy, professionalism, and communication",
          "Understand the limits of the technician&rsquo;s role and when to seek guidance"
        ])+'</div>',
      lessons:[
        {
          num:"0.1", title:"Introduction to the Clinic", topic:"Understanding the clinical environment",
          body:
            '<p>An ophthalmology clinic is a coordinated environment in which physicians, technicians, front-office staff, imaging staff, billing teams, and other clinical personnel work together to provide eye care.</p>'+
            '<p>Each team member has a different responsibility, but every role affects the patient&rsquo;s experience and the quality of care provided.</p>'+
            '<p>Technicians are responsible for gathering accurate information, completing assigned preliminary testing, documenting findings, preparing the patient for the physician, and communicating relevant concerns to the appropriate clinical team member.</p>'+
            '<h4>The specific duties of a technician may vary depending on</h4>'+
            UL(["Clinic","Physician","Reason for the visit","Patient&rsquo;s diagnosis","Equipment available","The clinic&rsquo;s established protocols"])+
            '<p>Trainees should not assume that every ophthalmology clinic follows the same workflow. Procedures that are routine in one clinic may be handled differently in another.</p>'+
            KT([
              "Ophthalmology care is a team-based process",
              "Technicians support both the patient and the physician",
              "Technician responsibilities may vary by clinic and physician",
              "Clinic-specific protocols should always be followed"
            ])
        },
        {
          num:"0.2", title:"Role of an Ophthalmology Technician", topic:"Core responsibilities",
          body:
            '<p>The ophthalmology technician supports the physician by collecting patient information, completing preliminary testing, documenting findings, and helping the clinic maintain an organized patient flow.</p>'+
            '<h4>At a general level, the technician&rsquo;s role is to</h4>'+
            OL([
              "Prepare the clinical environment",
              "Welcome and identify the correct patient",
              "Gather relevant information",
              "Complete assigned preliminary tasks",
              "Document information accurately",
              "Communicate important findings or concerns",
              "Prepare the patient for the physician",
              "Help maintain an organized and efficient clinic flow"
            ])+
            '<p>Technicians play an important role in helping the patient feel comfortable and making sure the physician has the information needed to begin the examination.</p>'+
            '<p>The specific tests, instruments, questions, and documentation requirements involved in this role will be introduced gradually throughout later modules.</p>'+
            '<p>At this stage, trainees are not expected to understand every clinical term or procedure. The goal is to understand the technician&rsquo;s position within the clinic and how the role supports the patient&rsquo;s visit.</p>'+
            '<h3>What the technician does not do</h3>'+
            '<p>Technicians should not independently:</p>'+
            UL([
              "Diagnose a medical or eye condition",
              "Decide on a treatment plan",
              "Change a physician&rsquo;s instructions",
              "Interpret findings for the patient as a final medical conclusion",
              "Perform a task they have not been trained or authorized to complete"
            ])+
            '<p>When a technician is uncertain, the correct action is to pause and ask the lead technician, trainer, physician, or appropriate supervisor.</p>'+
            KT([
              "The technician prepares the patient and supports the physician examination",
              "The technician gathers information, performs assigned tasks, and documents accurately",
              "Specific tests and procedures are introduced after the basic foundations are established",
              "Technicians do not independently diagnose or determine treatment",
              "Asking for clarification is expected when instructions are unclear"
            ])
        },
        {
          num:"0.3", title:"How Technicians Contribute to Patient Care", topic:"Accuracy, efficiency, and patient experience",
          body:
            '<p>Technicians contribute to patient care in several important ways.</p>'+
            '<h3>Accurate information collection</h3>'+
            '<p>The physician depends on the technician&rsquo;s documentation to understand the patient&rsquo;s symptoms, medical history, medication use, prior surgeries, and preliminary test results.</p>'+
            '<p>Incomplete or inaccurate information may cause:</p>'+
            UL(["Delays in care","Repeated questioning","Repeated testing","Confusion during the physician examination","Incorrect assumptions","Incomplete documentation"])+
            '<p>Technicians should never guess, copy forward information without verification, or enter findings that were not obtained.</p>'+
            '<h3>Efficient patient flow</h3>'+
            '<p>Technicians help the clinic stay organized by reviewing charts, calling patients in an appropriate order, completing workups efficiently, and preparing patients for the next stage of the visit.</p>'+
            '<p>Efficiency does not mean rushing. It means following a consistent process while maintaining accuracy and patient safety.</p>'+
            '<h3>Patient communication</h3>'+
            '<p>Patients may feel anxious, uncomfortable, or confused during an eye examination. A calm and professional technician can improve the patient&rsquo;s experience by explaining what will happen, answering appropriate questions, and communicating clearly.</p>'+
            KT([
              "Accurate technician work directly supports physician decision-making",
              "Efficiency should never replace accuracy or patient safety",
              "Clear communication improves the patient experience"
            ])
        },
        {
          num:"0.4", title:"Preparing the Clinical Area Before the Patient Arrives", topic:"Opening the clinical area",
          body:
            '<p>Before the first patient is seen, technicians help prepare the clinical area for the day.</p>'+
            '<p>Opening procedures help ensure that:</p>'+
            UL([
              "Examination rooms are ready",
              "Equipment is available and functioning",
              "Computers and clinical systems are accessible",
              "Frequently used supplies are stocked",
              "Patient areas are clean and organized",
              "The clinic can begin seeing patients without unnecessary delays"
            ])+
            '<p>Technicians should follow the clinic&rsquo;s approved opening checklist and report any missing supplies, equipment problems, or room concerns before patient care begins.</p>'+
            '<h3>Opening room preparation checklist</h3>'+
            OL([
              "Remove protective covers from slit lamps and other approved equipment",
              "Turn on room computers",
              "Log into Nextech EMR and open Eyemed EHR",
              "Turn on visual acuity displays",
              "Confirm visual acuity systems are functioning",
              "Ensure exam rooms are clean, organized, and ready for patient use",
              "Restock tissues or alcohol wipes if insufficient",
              "Confirm commonly used eye drops are available",
              "Confirm hand sanitizer, gloves, and other supplies are available when required",
              "Report missing supplies, damaged equipment, login problems, or room concerns before patients are brought back"
            ])+
            WARN("Important safety notes",
              '<p>Eye drops should be checked for:</p>'+UL(["Correct bottle","Expiration date","Contamination or damage","Proper storage","Adequate quantity"]))+
            KT([
              "Patient-care preparation begins before the first patient enters the clinic",
              "Opening tasks should follow a consistent, clinic-approved checklist",
              "Equipment or supply concerns should be reported before patient care begins",
              "Detailed opening procedures will be taught during later lessons and in-person training"
            ])
        },
        {
          num:"0.5", title:"Closing the Clinical Area at the End of the Day", topic:"End-of-day responsibilities",
          body:
            '<p>After the final patient has been seen, technicians help close and prepare the clinical area for the next working day.</p>'+
            '<p>Closing procedures help:</p>'+
            UL(["Protect clinic equipment","Maintain clean and organized rooms","Restock commonly used supplies","Identify equipment or supply problems","Reduce delays when the clinic opens again"])+
            '<p>Technicians should follow the clinic&rsquo;s approved closing checklist and report any incomplete tasks, equipment concerns, or supply shortages to the appropriate team member.</p>'+
            '<h3>Closing checklist</h3>'+
            OL([
              "Wipe down surfaces, chairs, remote controls, and the slit lamp with a disinfecting wipe",
              "Cover the slit lamp with protective covers",
              "Restock supplies",
              "Log out of the clinical systems and shut down the computers",
              "Turn off any equipment unless told otherwise",
              "Report maintenance concerns",
              "Prepare rooms for the next clinic day"
            ])+
            KT([
              "The technician&rsquo;s responsibilities continue after the final patient leaves",
              "Closing tasks help protect equipment, patient information, and clinic readiness",
              "Closing procedures should follow a consistent, clinic-approved checklist",
              "Problems discovered during closing should be reported rather than left for the next day"
            ])
        },
        {
          num:"0.6", title:"Overview of the Patient Journey", topic:"The patient&rsquo;s path through the clinic",
          body:
            '<p>A patient&rsquo;s visit includes several connected steps. The technician is involved in the middle portion of the visit and helps connect the front-office process with the physician examination.</p>'+
            '<p>A simplified patient journey may include the following:</p>'+
            '<h4>1 &middot; Appointment is scheduled</h4>'+
            '<p>The patient is scheduled for a specific date, time, physician, and reason for visit. The scheduled visit type may help determine what information or testing will be needed. However, the appointment label or billing code should not be used as the only source for deciding the clinical workup.</p>'+
            '<h4>2 &middot; Chart is reviewed</h4>'+
            '<p>Before the patient is called into the clinical area, the chart may be reviewed for relevant information. The technician may check:</p>'+
            UL(["Whether the patient is new or established","The reason for the visit","Previous diagnoses","Prior testing","Current eye medications","Physician instructions"])+
            '<p>Chart review is recommended when time and clinic workflow allow.</p>'+
            '<h4>3 &middot; Patient checks in</h4>'+
            '<p>The front-office team confirms the patient&rsquo;s arrival and completes the required check-in process. Technicians should generally follow the clinic&rsquo;s patient-ordering process and consider both check-in time and appointment time when determining which patient to call next.</p>'+
            '<h4>4 &middot; Technician reviews the reason for visit</h4>'+
            '<p>The technician confirms why the patient is being seen and identifies any new or worsening symptoms. The patient&rsquo;s current concern should be documented using the patient&rsquo;s description whenever possible.</p>'+
            '<h4>5 &middot; History and preliminary testing are completed</h4>'+
            '<p>The technician reviews relevant medical and ocular history and performs the required preliminary testing. This may include:</p>'+
            UL(["Visual acuity","Intraocular pressure","Medication review","Medical history","Surgical history","Autorefraction","Fundus photography"])+
            '<p>Preliminary testing will be explained further throughout the module. The exact workup depends on clinic protocol, the physician, and the reason for the visit.</p>'+
            '<h4>6 &middot; Additional imaging or diagnostic testing is performed</h4>'+
            '<p>Some visits require additional testing before or after the physician examination. Examples may include:</p>'+
            UL(["Visual field testing","Fundus photography","Corneal imaging","Optical coherence tomography"])+
            '<h4>7 &middot; Physician examines the patient</h4>'+
            '<p>The physician reviews the technician&rsquo;s documentation and test results, speaks with the patient, performs the examination, and determines the clinical assessment. The technician&rsquo;s work should make it easy for the physician to identify the patient&rsquo;s main concerns, relevant history, medication, test results, and any abnormal findings.</p>'+
            '<h4>8 &middot; Treatment, procedure, follow-up, or referral is determined</h4>'+
            '<p>After the examination, the physician may recommend:</p>'+
            UL(["Observation","Medication","Additional testing","A procedure","Surgery","A follow-up visit","Referral to another provider"])+
            '<p>Technicians may help reinforce instructions when directed, but they should not independently interpret or modify the physician&rsquo;s plan.</p>'+
            '<h4>9 &middot; Documentation and checkout are completed</h4>'+
            '<p>Before the patient leaves, the chart and visit documentation should be completed. The patient may then receive:</p>'+
            UL(["Follow-up instructions","Prescriptions","Educational materials","Referrals","Scheduling assistance"])+
            '<h3>The technician&rsquo;s position in the patient journey</h3>'+
            '<p>The technician serves as a bridge between patient check-in and the physician examination. The technician&rsquo;s responsibilities include:</p>'+
            OL([
              "Preparing before the patient enters the room",
              "Confirming the correct patient",
              "Gathering accurate information",
              "Performing required testing",
              "Documenting findings",
              "Communicating concerns",
              "Preparing the physician for the examination",
              "Confirming that required information and testing are available in the chart"
            ])+
            '<p>A technician&rsquo;s work can influence how smoothly the rest of the visit proceeds.</p>'+
            KT([
              "The technician works between patient check-in and the physician examination",
              "Each step of the patient journey affects the next step",
              "Accurate documentation and testing help the physician conduct an informed examination",
              "The technician should understand the entire visit, not only the tasks performed in the examination room"
            ])
        },
        {
          num:"0.7", title:"Expectations Before In-Person Training", topic:"Preparing for hands-on learning",
          body:
            '<p>Before beginning in-person training, trainees should complete the assigned introductory material and become familiar with the clinic&rsquo;s basic terminology and workflow.</p>'+
            '<p>Trainees may be expected to understand:</p>'+
            UL([
              "The general role of the ophthalmology technician",
              "The basic patient journey",
              "Common clinic terminology",
              "Patient identity-confirmation procedures",
              "Privacy and professionalism expectations",
              "Basic eye anatomy",
              "The purpose of common preliminary tests",
              "When to seek assistance",
              "The difference between required, recommended, and physician-dependent tasks"
            ])+
            '<p>Trainees are not expected to perform unfamiliar procedures independently before receiving instruction and demonstrating competency.</p>'+
            '<h4>During hands-on training, trainees should</h4>'+
            UL([
              "Ask questions when uncertain","Take notes","Observe experienced technicians","Practice under supervision",
              "Accept constructive feedback","Avoid rushing","Follow the trainer&rsquo;s instructions",
              "Report errors or near misses immediately","Avoid performing unapproved tasks independently"
            ])+
            KT([
              "Online training prepares the trainee for supervised clinical practice",
              "Reading a procedure does not replace hands-on competency",
              "Trainees should ask for help rather than guess",
              "New skills should be practiced under appropriate supervision"
            ])
        },
        {
          num:"0.8", title:"Scope of Practice", topic:"Understanding the limits of the technician role",
          body:
            '<p>Scope of practice refers to the duties a technician is trained, authorized, and permitted to perform.</p>'+
            '<p>A technician&rsquo;s responsibilities may be affected by:</p>'+
            UL(["Physician supervision","Training and competency","Equipment authorization","Patient condition","The complexity of the task"])+
            '<p>Technicians should not assume they are permitted to perform a task simply because they have seen another employee perform it.</p>'+
            WARN("Stop and ask",
              '<p>Pause and seek guidance when:</p>'+UL([
                "Instructions are unclear",
                "The patient reports an urgent symptom",
                "A test result appears unusual or unreliable",
                "The patient refuses a test",
                "The patient has a condition that may affect testing",
                "The technician has not been trained on the requested procedure",
                "There is uncertainty about dilation",
                "There is uncertainty about medication administration",
                "The requested task appears outside the technician&rsquo;s role"
              ]))+
            KT([
              "Technicians should only perform tasks they are trained and authorized to perform",
              "Observing a procedure does not automatically establish competency",
              "Technicians should stop and seek guidance when patient safety or role boundaries are unclear"
            ])
        },
        {
          num:"0.9", title:"Patient Privacy and Professionalism", topic:"Protecting patient information and conducting yourself professionally",
          body:
            '<p>Patient information must be handled carefully and only used for legitimate clinical purposes.</p>'+
            '<p>Protected information may include:</p>'+
            UL([
              "Patient name","Date of birth","Address","Phone number","Medical record number","Diagnoses","Medications",
              "Test results","Appointment information","Photographs","Imaging","Insurance information","Conversations about the patient&rsquo;s care"
            ])+
            '<p>Technicians should not:</p>'+
            UL([
              "Discuss patient information in public areas",
              "Leave charts or screens visible to unauthorized individuals",
              "Share patient details with friends or family",
              "Take personal photographs of charts or patients",
              "Store patient information in personal notes or personal software",
              "Use real patient information in training materials without authorization",
              "Access charts that are unrelated to their work responsibilities",
              "Post patient-related information on social media"
            ])+
            '<p>Training examples should use fictional or properly de-identified information.</p>'+
            '<h3>Professional conduct</h3>'+
            '<p>Professionalism includes how technicians speak, behave, document, and respond to patients and coworkers. Professional behavior includes:</p>'+
            UL([
              "Welcoming the patient","Confirming the patient&rsquo;s identity","Using respectful language",
              "Explaining procedures before beginning","Protecting the patient&rsquo;s dignity","Listening without interrupting",
              "Remaining calm with anxious or frustrated patients","Avoiding judgmental comments","Documenting objectively",
              "Arriving prepared and on time","Communicating delays when appropriate","Asking for help when needed","Accepting feedback respectfully"
            ])+
            '<p>Technicians should avoid discussing personal disagreements, workplace complaints, or confidential clinic matters in front of patients.</p>'+
            '<h3>Objective communication and documentation</h3>'+
            '<p>Documentation should be factual, clear, and professional. Avoid:</p>'+
            UL(["Personal opinions","Blame","Humor that could be misunderstood","Judgmental descriptions","Unsupported conclusions","Diagnoses not made by the physician","Copying information that has not been verified"])+
            '<p>When documenting a patient statement, use neutral wording.</p>'+
            '<p style="color:var(--faint);font-size:.86em;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:.4em">Instead of writing</p>'+
            '<blockquote>Patient was difficult and refused everything.</blockquote>'+
            '<p style="color:var(--faint);font-size:.86em;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:.4em">Write</p>'+
            '<blockquote class="q-good">Patient declined dilation after the procedure was explained. Physician was notified.</blockquote>'+
            KT([
              "Patient information must remain private",
              "Personal devices and accounts should not be used to store patient information",
              "Professionalism applies to communication, behavior, and charting",
              "Documentation should be factual, neutral, and accurate"
            ])
        }
      ]
    },
                                    {
      id:"m1", label:"Module 1", title:"Foundations of Ophthalmology",
      status:"available",
      desc:"Optometry vs. ophthalmology, eye anatomy, symptoms, diseases, instruments, and procedures.",
      overview:"<p class=\"lead\">This module introduced the foundational knowledge that ophthalmology technicians need before learning detailed patient workups and hands-on clinical procedures.</p><p>Trainees will first learn how optometry and ophthalmology relate to one another. They will then study the major structures of the eye, common symptoms, frequently encountered eye conditions, diagnostic testing, and common ophthalmic procedures.</p><p>The purpose of this module is not to prepare technicians to diagnose patients. Instead, it is designed to help trainees understand:</p><ul><li>What part of the eye is being evaluated</li><li>Why a patient may be visiting the clinic</li><li>Why certain questions are important</li><li>Why a physician may request a particular test</li><li>How symptoms, anatomy, diseases, tests, and procedures connect</li><li>When a symptom or finding should be promptly communicated to the clinical team</li></ul><p>Detailed instructions for performing individual tests and procedures will be introduced in later modules and reinforced through supervised in-person training.</p><div class=\"callout callout--key\"><h4 class=\"callout__title\">Learning objectives</h4><p style=\"margin:0 0 .7em;color:var(--ink-2)\">By the end of this module, the trainee should be able to:</p><ul><li>Explain the general differences and overlap between optometry and ophthalmology.</li><li>Identify the major external, anterior, and posterior structures of the eye.</li><li>Describe the basic function of each major eye structure.</li><li>Recognize common reasons patients visit an ophthalmology clinic.</li><li>Gather basic details about the onset, location, duration, and pattern of a symptom.</li><li>Recognize symptoms that require prompt escalation according to clinic protocol.</li><li>Connect common ophthalmic conditions with the anatomy they affect.</li><li>Explain the general purpose of commonly used ophthalmic tests.</li><li>Connect common diseases with relevant diagnostic testing.</li><li>Describe the basic purpose of common ophthalmic procedures.</li><li>Understand that technicians collect information and perform assigned testing but do not independently diagnose or determine treatment.</li></ul></div>",
      lessons:[
        {num:"1.1", title:"Optometry and Ophthalmology", topic:"", body:"<p class=\"lead\">Patients may receive eye care from an optometrist, an ophthalmologist, or both. Although the two professions have overlapping responsibilities, their education, scope of practice, and services may differ.</p><p>The goal of this lesson is not to present the two fields as competitors or as completely separate. Instead, trainees should understand how the fields work together within the larger eye-care system.</p><p>An optometrist may examine, diagnose, treat, and manage a variety of eye and vision conditions. The exact services an optometrist may provide can vary by state law, training, and practice setting.</p><p>An ophthalmologist is a physician who is trained in the medical and surgical care of the eyes. Ophthalmologists may provide routine eye care, manage eye disease, perform procedures, and perform eye surgery.</p><h4 class=\"m-sub\">Topic 1: What is Optometry?</h4><p>Optometry is a field of eye and vision care.</p><p>Optometrists commonly provide:</p><ul><li>Comprehensive and routine eye examinations</li><li>Glasses prescriptions</li><li>Contact lens prescriptions and fittings</li><li>Evaluation of refractive concerns</li><li>Screening for eye disease</li><li>Diagnosis and management of many eye conditions</li><li>Referral to another eye-care specialist when additional medical or surgical care is needed</li></ul><p>The services an optometrist is permitted to perform may vary by state and practice setting.</p><div class=\"callout callout--key\"><h4 class=\"callout__title\">Key takeaways</h4><ul><li>Optometrists provide primary eye and vision care</li><li>Optometrists do more than prescribe glasses and contact lenses</li><li>Their scope may include diagnosis and medical management of eye disease</li><li>Scope of practice can vary by state</li></ul></div><h4 class=\"m-sub\">Topic 2: What is Ophthalmology?</h4><p>Ophthalmology is a medical specialty focused on the diagnosis and treatment of eye conditions.</p><p>An ophthalmologist is a physician who has completed medical training and specialty training in eye care.</p><p>Ophthalmologists may provide:</p><ul><li>Medical eye examinations</li><li>Diagnosis and ongoing management of eye disease</li><li>Prescription medications</li><li>Laser procedures</li><li>Injections</li><li>Surgical evaluations</li><li>Eye surgery</li><li>Preoperative and postoperative care</li><li>Emergency eye care</li></ul><div class=\"callout callout--key\"><h4 class=\"callout__title\">Key takeaways</h4><ul><li>Ophthalmologists are physicians who specialize in eye care.</li><li>They may diagnose and medically manage eye disease.</li><li>They are trained to perform eye surgery.</li><li>Some ophthalmologists specialize in a particular area, such as retina, glaucoma, or cornea.</li></ul></div><h4 class=\"m-sub\">Topic 3: Similarities and Differences</h4><p>Both optometrists and ophthalmologists may:</p><ul><li>Examine the eyes</li><li>Evaluate vision</li><li>Identify eye disease</li><li>Prescribe certain medications</li><li>Monitor chronic eye conditions</li><li>Order or perform diagnostic testing</li><li>Refer patients to other specialists</li><li>Work together in the care of the same patient</li></ul><p>General differences may involve:</p><ul><li>Education and training</li><li>Surgery</li><li>Subspecialty care</li></ul><h4 class=\"m-sub\">Topic 4: Common Reasons to See an Optometrist</h4><p>Patients commonly see an optometrist for:</p><ul><li>Routine eye examinations</li><li>Glasses prescriptions</li><li>Contact lens prescriptions</li><li>Contact lens fitting</li><li>Blurred vision related to refractive error</li><li>Near-vision difficulty</li><li>Basic visual complaints</li><li>Routine eye-health screening</li><li>Monitoring of certain stable eye conditions</li><li>Referral when more specialized care is needed</li></ul><h4 class=\"m-sub\">Topic 5: Common Reasons to See an Ophthalmologist</h4><p>Patients commonly see an ophthalmologist for:</p><ul><li>Cataracts</li><li>Glaucoma or elevated intraocular pressure</li><li>Diabetic eye disease</li><li>Macular degeneration</li><li>Retinal tears or detachments</li><li>Eye inflammation</li><li>Serious eye infections</li><li>Sudden vision changes</li><li>Eye injuries</li><li>Surgical evaluation</li><li>Laser procedures</li><li>Injections</li><li>Ongoing management of eye disease</li></ul><h4 class=\"m-sub\">Topic 6: When Care Overlaps</h4><p>A patient may receive care from both an optometrist and an ophthalmologist.</p><p>For example, an optometrist may identify a cataract during an eye examination and refer the patient to an ophthalmologist for surgical evaluation. After surgery, the patient may continue seeing one or both providers, depending on the care arrangement.</p><p>Similarly, an optometrist may identify elevated eye pressure and refer the patient for glaucoma evaluation. The patient may then receive continued care from an ophthalmologist, an optometrist, or both.</p><div class=\"callout callout--key\"><h4 class=\"callout__title\">Key takeaways</h4><ul><li>Optometry and ophthalmology have meaningful areas of overlap</li><li>Optometrists provide primary eye and vision care and may manage many eye conditions</li><li>Ophthalmologists are physicians trained in the medical and surgical care of the eyes</li><li>Patients may receive care from both professions</li></ul></div>"},
        {num:"1.2", title:"Fundamental Eye Anatomy", topic:"", body:"<p class=\"lead\">Understanding eye anatomy helps technicians understand:</p><ul><li>What the physician is examining</li><li>Why a patient has a particular symptom</li><li>Why a certain test is ordered</li><li>Which part of the eye may be affected by a disease</li><li>How different eye conditions can affect vision</li></ul><p>Eye anatomy will be introduced from the outside of the eye toward the back.</p><p>The goal is to build basic recognition. Trainees are not expected to memorize every microscopic structure during this lesson.</p><p class=\"m-label\"><strong>Anatomy Learning Framework</strong></p><p>For each structure, trainees should learn:</p><ol><li>Where it is located</li><li>Its basic function</li><li>Symptoms that may occur when it is affected</li><li>Conditions commonly associated with it</li><li>How it may be examined or tested</li></ol><h3 class=\"m-sec\">Unit A: External Structures</h3><p>In your clinic&rsquo;s workflow, the <strong>external examination includes the visible ocular structures as well as pupils, motility, and confrontation visual fields</strong>.</p><h4 class=\"m-sub\">Eyelids</h4><div class=\"tbl\"><table>\n<tr>\n<td>Category</td>\n<td>Key information</td>\n</tr>\n<tr>\n<td><strong>Location</strong></td>\n<td>Movable folds of skin and tissue covering the front of the eyes</td>\n</tr>\n<tr>\n<td><strong>Basic function</strong></td>\n<td>Protect the eye, distribute the tear film during blinking, and help prevent the ocular surface from drying</td>\n</tr>\n<tr>\n<td><strong>Possible symptoms when affected</strong></td>\n<td>Swelling, redness, pain, itching, crusting, drooping, incomplete closure, foreign-body sensation, or excessive tearing</td>\n</tr>\n<tr>\n<td><strong>Common associated conditions</strong></td>\n<td>Blepharitis, chalazion, hordeolum or stye, ptosis, entropion, ectropion, lagophthalmos, and eyelid lesions</td>\n</tr>\n<tr>\n<td><strong>Common evaluation methods</strong></td>\n<td>External inspection, assessment of eyelid position and symmetry, blink and closure evaluation, lid eversion, and slit-lamp examination</td>\n</tr>\n</table></div><p>The eyelids protect the ocular surface and help keep it moist by spreading tears with each blink.</p><h4 class=\"m-sub\">Eyelashes</h4><div class=\"tbl\"><table>\n<tr>\n<td>Category</td>\n<td>Key information</td>\n</tr>\n<tr>\n<td><strong>Location</strong></td>\n<td>Along the edges of the upper and lower eyelids</td>\n</tr>\n<tr>\n<td><strong>Basic function</strong></td>\n<td>Help block dust, debris, and small foreign materials from reaching the ocular surface</td>\n</tr>\n<tr>\n<td><strong>Possible symptoms when affected</strong></td>\n<td>Irritation, scratching sensation, redness, tearing, or foreign-body sensation</td>\n</tr>\n<tr>\n<td><strong>Common associated conditions</strong></td>\n<td>Trichiasis, distichiasis, blepharitis, lash loss, and lash-related corneal abrasion</td>\n</tr>\n<tr>\n<td><strong>Common evaluation methods</strong></td>\n<td>Direct inspection, magnified slit-lamp examination, and fluorescein staining if corneal contact or abrasion is suspected</td>\n</tr>\n</table></div><p>Abnormally directed lashes can rub against the cornea and produce irritation or epithelial damage. External inspection and slit-lamp examination help identify the affected lashes and ocular-surface injury.</p><h4 class=\"m-sub\">Conjunctiva</h4><div class=\"tbl\"><table>\n<tr>\n<td>Category</td>\n<td>Key information</td>\n</tr>\n<tr>\n<td><strong>Location</strong></td>\n<td>Thin membrane covering the sclera and lining the inside of the eyelids</td>\n</tr>\n<tr>\n<td><strong>Basic function</strong></td>\n<td>Protects and lubricates the ocular surface and contributes to the tear film</td>\n</tr>\n<tr>\n<td><strong>Possible symptoms when affected</strong></td>\n<td>Redness, itching, burning, discharge, swelling, tearing, or foreign-body sensation</td>\n</tr>\n<tr>\n<td><strong>Common associated conditions</strong></td>\n<td>Viral, bacterial, or allergic conjunctivitis; subconjunctival hemorrhage; conjunctival lesions; chemosis; and dry-eye-related inflammation</td>\n</tr>\n<tr>\n<td><strong>Common evaluation methods</strong></td>\n<td>External inspection, slit-lamp examination, lid eversion, discharge assessment, and fluorescein staining when indicated</td>\n</tr>\n</table></div><p>The conjunctiva is inspected for redness, discharge, swelling, lesions, hemorrhage, and signs of inflammation during the external and slit-lamp examinations.</p><h4 class=\"m-sub\">Sclera</h4><div class=\"tbl\"><table>\n<tr>\n<td>Category</td>\n<td>Key information</td>\n</tr>\n<tr>\n<td><strong>Location</strong></td>\n<td>Tough white outer coating surrounding most of the eyeball</td>\n</tr>\n<tr>\n<td><strong>Basic function</strong></td>\n<td>Protects the internal eye, maintains globe shape, and provides attachment for the extraocular muscles</td>\n</tr>\n<tr>\n<td><strong>Possible symptoms when affected</strong></td>\n<td>Deep eye pain, tenderness, redness, pain with eye movement, or occasionally minimal discomfort</td>\n</tr>\n<tr>\n<td><strong>Common associated conditions</strong></td>\n<td>Episcleritis, scleritis, scleral thinning, blue sclera, and ocular trauma</td>\n</tr>\n<tr>\n<td><strong>Common evaluation methods</strong></td>\n<td>External inspection, slit-lamp examination, assessment of pain and tenderness, and examination under different illumination</td>\n</tr>\n</table></div><p>The sclera forms the white outer coating of the eye; inflammation involving deeper scleral tissue is generally more painful than superficial ocular-surface inflammation.</p><h4 class=\"m-sub\">Cornea</h4><div class=\"tbl\"><table>\n<tr>\n<td>Category</td>\n<td>Key information</td>\n</tr>\n<tr>\n<td><strong>Location</strong></td>\n<td>Clear, dome-shaped front surface covering the iris and pupil</td>\n</tr>\n<tr>\n<td><strong>Basic function</strong></td>\n<td>Protects the front of the eye and provides much of the eye&rsquo;s focusing or refractive power</td>\n</tr>\n<tr>\n<td><strong>Possible symptoms when affected</strong></td>\n<td>Blurry vision, pain, photophobia, tearing, redness, halos, or foreign-body sensation</td>\n</tr>\n<tr>\n<td><strong>Common associated conditions</strong></td>\n<td>Corneal abrasion, keratitis, ulcer, dry eye, corneal edema, keratoconus, dystrophy, scar, and foreign body</td>\n</tr>\n<tr>\n<td><strong>Common evaluation methods</strong></td>\n<td>Visual acuity, slit-lamp examination, fluorescein staining, corneal topography or tomography, pachymetry, keratometry, and corneal sensation testing</td>\n</tr>\n</table></div><p>The cornea bends incoming light to help focus it. Because it is highly sensitive, corneal disease often causes pain, tearing, photophobia, and decreased vision.</p><h4 class=\"m-sub\">Tear Film</h4><div class=\"tbl\"><table>\n<tr>\n<td>Category</td>\n<td>Key information</td>\n</tr>\n<tr>\n<td><strong>Location</strong></td>\n<td>Thin layer of fluid coating the cornea and conjunctiva</td>\n</tr>\n<tr>\n<td><strong>Basic function</strong></td>\n<td>Keeps the ocular surface moist, nourished, smooth, and optically clear while helping flush away debris</td>\n</tr>\n<tr>\n<td><strong>Possible symptoms when affected</strong></td>\n<td>Burning, grittiness, fluctuating vision, redness, tearing, dryness, eye fatigue, or contact-lens intolerance</td>\n</tr>\n<tr>\n<td><strong>Common associated conditions</strong></td>\n<td>Dry eye disease, meibomian gland dysfunction, blepharitis, exposure keratopathy, and tear-film instability</td>\n</tr>\n<tr>\n<td><strong>Common evaluation methods</strong></td>\n<td>Tear breakup time, fluorescein or lissamine green staining, Schirmer testing, tear meniscus assessment, and meibomian gland evaluation</td>\n</tr>\n</table></div><p>A stable tear film is important for ocular comfort and clear vision; a poor tear surface can cause vision to fluctuate, especially between blinks.</p><h4 class=\"m-sub\">Lacrimal System</h4><div class=\"tbl\"><table>\n<tr>\n<td>Category</td>\n<td>Key information</td>\n</tr>\n<tr>\n<td><strong>Location</strong></td>\n<td>Includes the lacrimal gland above the outer eye and the puncta, canaliculi, lacrimal sac, and nasolacrimal duct near the inner eyelids and nose</td>\n</tr>\n<tr>\n<td><strong>Basic function</strong></td>\n<td>Produces tears and drains them from the eye into the nasal cavity</td>\n</tr>\n<tr>\n<td><strong>Possible symptoms when affected</strong></td>\n<td>Excessive tearing, discharge, swelling near the inner corner of the eye, tenderness, dryness, or recurrent infection</td>\n</tr>\n<tr>\n<td><strong>Common associated conditions</strong></td>\n<td>Nasolacrimal duct obstruction, dacryocystitis, punctal stenosis, canaliculitis, aqueous-deficient dry eye, and lacrimal gland inflammation</td>\n</tr>\n<tr>\n<td><strong>Common evaluation methods</strong></td>\n<td>Inspection of the puncta, palpation over the lacrimal sac, dye disappearance testing, irrigation or probing, tear testing, and imaging when indicated</td>\n</tr>\n</table></div><p>The tear system includes both tear-producing and tear-draining structures; dysfunction can therefore cause either dryness or excessive tearing.</p><h4 class=\"m-sub\">Extraocular Muscles and Motility</h4><div class=\"tbl\"><table>\n<tr>\n<td>Category</td>\n<td>Key information</td>\n</tr>\n<tr>\n<td><strong>Location</strong></td>\n<td>Six muscles attached to the outside of each eyeball within the orbit</td>\n</tr>\n<tr>\n<td><strong>Basic function</strong></td>\n<td>Move the eyes in coordinated directions and help maintain binocular alignment</td>\n</tr>\n<tr>\n<td><strong>Possible symptoms when affected</strong></td>\n<td>Double vision, eye strain, abnormal head position, limited movement, misalignment, oscillating vision, or eye pain with movement</td>\n</tr>\n<tr>\n<td><strong>Common associated conditions</strong></td>\n<td>Strabismus, cranial nerve III, IV, or VI palsy; thyroid eye disease; orbital fracture; myasthenia gravis; nystagmus; and restrictive orbital disease</td>\n</tr>\n<tr>\n<td><strong>Common evaluation methods</strong></td>\n<td>Extraocular movement testing, versions and ductions, cover testing, alternate-cover testing, alignment assessment, prism measurements, and diplopia testing</td>\n</tr>\n</table></div><p>Motility is commonly assessed by having the patient follow a target in different directions while the examiner observes alignment, movement restriction, nystagmus, and symptom reproduction.</p><h4 class=\"m-sub\">The six extraocular muscles</h4><ul><li><strong>Medial rectus:</strong> moves the eye inward</li><li><strong>Lateral rectus:</strong> moves the eye outward</li><li><strong>Superior rectus:</strong> primarily moves the eye upward</li><li><strong>Inferior rectus:</strong> primarily moves the eye downward</li><li><strong>Superior oblique:</strong> primarily intorts and helps move the eye downward</li><li><strong>Inferior oblique:</strong> primarily extorts and helps move the eye upward</li></ul><p>Actual eye movement is produced by coordinated action among several muscles rather than one muscle working completely alone.</p><h4 class=\"m-sub\">Pupils</h4><div class=\"tbl\"><table>\n<tr>\n<td>Category</td>\n<td>Key information</td>\n</tr>\n<tr>\n<td><strong>Location</strong></td>\n<td>Opening in the center of the iris</td>\n</tr>\n<tr>\n<td><strong>Basic function</strong></td>\n<td>Regulates how much light enters the eye through changes controlled by the iris</td>\n</tr>\n<tr>\n<td><strong>Possible symptoms when affected</strong></td>\n<td>Unequal pupil size, poor light response, light sensitivity, blurry near vision, drooping eyelid, or sometimes no symptoms</td>\n</tr>\n<tr>\n<td><strong>Common associated conditions</strong></td>\n<td>Physiologic anisocoria, relative afferent pupillary defect, optic neuropathy, severe retinal disease, third-nerve palsy, Horner syndrome, Adie tonic pupil, trauma, and medication-related dilation</td>\n</tr>\n<tr>\n<td><strong>Common evaluation methods</strong></td>\n<td>Pupil size in light and dark, direct and consensual light responses, swinging-flashlight test, near response, shape assessment, and medication testing when ordered</td>\n</tr>\n</table></div><p>The pupil is an opening rather than a piece of tissue. The iris changes its size, while pupil responses also provide information about the retina, optic nerve, and neurologic pathways.</p><h4 class=\"m-sub\">Basic pupil documentation</h4><p>A common documentation pattern is:</p><ul><li><strong>PERRL:</strong> Pupils equal, round, and reactive to light</li><li><strong>No RAPD:</strong> No relative afferent pupillary defect</li><li>Record the pupil size in millimeters when required</li></ul><h4 class=\"m-sub\">Confrontation Visual Fields (CVF)</h4><p>CVF is an <strong>examination method</strong>, not an anatomical structure. It assesses the patient&rsquo;s functional visual field.</p><div class=\"tbl\"><table>\n<tr>\n<td>Category</td>\n<td>Key information</td>\n</tr>\n<tr>\n<td><strong>Area evaluated</strong></td>\n<td>Peripheral visual field produced by the retina, optic nerves, optic chiasm, optic tracts, visual radiations, and occipital cortex</td>\n</tr>\n<tr>\n<td><strong>Basic function evaluated</strong></td>\n<td>Ability to detect objects outside direct central fixation</td>\n</tr>\n<tr>\n<td><strong>Possible symptoms when affected</strong></td>\n<td>Missing areas of vision, bumping into objects, difficulty driving, tunnel vision, or loss of vision on one side</td>\n</tr>\n<tr>\n<td><strong>Common associated conditions</strong></td>\n<td>Glaucoma, retinal detachment, retinal vascular occlusion, optic neuropathy, pituitary or chiasmal lesion, stroke, and other neurologic disease</td>\n</tr>\n<tr>\n<td><strong>Common evaluation methods</strong></td>\n<td>Confrontation visual fields, finger counting, finger movement, red-target comparison, automated perimetry, and Goldmann kinetic perimetry</td>\n</tr>\n</table></div><p>During CVF testing, the patient maintains central fixation while each quadrant is screened. Formal automated perimetry is more sensitive and maps field loss more precisely.</p><h3 class=\"m-sec\">Unit B: Anterior Segment</h3><p>The anterior segment generally includes the structures from the <strong>cornea through the lens</strong>, including the aqueous-filled chambers.</p><h4 class=\"m-sub\">Anterior Chamber</h4><div class=\"tbl\"><table>\n<tr>\n<td>Category</td>\n<td>Key information</td>\n</tr>\n<tr>\n<td><strong>Location</strong></td>\n<td>Space between the back of the cornea and the front of the iris</td>\n</tr>\n<tr>\n<td><strong>Basic function</strong></td>\n<td>Holds aqueous humor and provides a clear pathway for light while supporting normal intraocular pressure</td>\n</tr>\n<tr>\n<td><strong>Possible symptoms when affected</strong></td>\n<td>Eye pain, redness, photophobia, blurry vision, halos, or sometimes no symptoms</td>\n</tr>\n<tr>\n<td><strong>Common associated conditions</strong></td>\n<td>Anterior uveitis, hyphema, hypopyon, angle-closure glaucoma, pigment dispersion, and inflammation after surgery or trauma</td>\n</tr>\n<tr>\n<td><strong>Common evaluation methods</strong></td>\n<td>Slit-lamp examination, anterior chamber cell-and-flare grading, Van Herick angle estimation, gonioscopy, and anterior-segment OCT</td>\n</tr>\n</table></div><p>A narrow slit-lamp beam allows the examiner to assess the depth and contents of the anterior chamber, including inflammatory cells, blood, or other material.</p><h4 class=\"m-sub\">Aqueous Humor</h4><div class=\"tbl\"><table>\n<tr>\n<td>Category</td>\n<td>Key information</td>\n</tr>\n<tr>\n<td><strong>Location</strong></td>\n<td>Clear fluid filling the posterior chamber behind the iris and anterior chamber in front of the iris</td>\n</tr>\n<tr>\n<td><strong>Basic function</strong></td>\n<td>Nourishes the cornea and lens, removes waste, and helps maintain intraocular pressure</td>\n</tr>\n<tr>\n<td><strong>Possible symptoms when affected</strong></td>\n<td>Usually no direct symptoms unless pressure or inflammation develops; possible pain, halos, redness, headache, nausea, or blurry vision</td>\n</tr>\n<tr>\n<td><strong>Common associated conditions</strong></td>\n<td>Ocular hypertension, open-angle glaucoma, angle-closure glaucoma, uveitis, and postoperative pressure changes</td>\n</tr>\n<tr>\n<td><strong>Common evaluation methods</strong></td>\n<td>Tonometry, gonioscopy, slit-lamp examination, optic-nerve evaluation, OCT, and visual-field testing</td>\n</tr>\n</table></div><p>Aqueous humor is produced by the ciliary body and normally flows through the pupil before leaving through the eye&rsquo;s drainage structures. Disrupted production or drainage can change intraocular pressure.</p><h4 class=\"m-sub\">Iris</h4><div class=\"tbl\"><table>\n<tr>\n<td>Category</td>\n<td>Key information</td>\n</tr>\n<tr>\n<td><strong>Location</strong></td>\n<td>Colored circular tissue behind the cornea and in front of the lens</td>\n</tr>\n<tr>\n<td><strong>Basic function</strong></td>\n<td>Changes pupil size to regulate the amount of light entering the eye</td>\n</tr>\n<tr>\n<td><strong>Possible symptoms when affected</strong></td>\n<td>Photophobia, pain, redness, irregular pupil, blurred vision, or color difference between the eyes</td>\n</tr>\n<tr>\n<td><strong>Common associated conditions</strong></td>\n<td>Iritis or anterior uveitis, posterior synechiae, iris atrophy, iris nevus, iris melanoma, rubeosis, trauma, and iris transillumination defects</td>\n</tr>\n<tr>\n<td><strong>Common evaluation methods</strong></td>\n<td>Pupil examination, slit-lamp examination, transillumination, gonioscopy, anterior-segment photography, ultrasound biomicroscopy, and anterior-segment OCT</td>\n</tr>\n</table></div><p>The iris regulates light entry by adjusting the diameter of its central opening, the pupil.</p><h4 class=\"m-sub\">Anterior Chamber Angle</h4><div class=\"tbl\"><table>\n<tr>\n<td>Category</td>\n<td>Key information</td>\n</tr>\n<tr>\n<td><strong>Location</strong></td>\n<td>Junction where the peripheral cornea and iris meet</td>\n</tr>\n<tr>\n<td><strong>Basic function</strong></td>\n<td>Contains the major aqueous drainage pathway, including the trabecular meshwork</td>\n</tr>\n<tr>\n<td><strong>Possible symptoms when affected</strong></td>\n<td>Often none if narrowing is gradual; acute closure can cause severe pain, headache, halos, redness, blurred vision, nausea, and vomiting</td>\n</tr>\n<tr>\n<td><strong>Common associated conditions</strong></td>\n<td>Primary open-angle glaucoma, narrow angles, angle-closure glaucoma, pigment dispersion, pseudoexfoliation, angle recession, and neovascular glaucoma</td>\n</tr>\n<tr>\n<td><strong>Common evaluation methods</strong></td>\n<td>Gonioscopy, Van Herick estimation, anterior-segment OCT, ultrasound biomicroscopy, and tonometry</td>\n</tr>\n</table></div><p>A patient can have anatomically narrow angles without symptoms. Gonioscopy is used to directly evaluate whether the angle is open or closed and to inspect its structures.</p><h4 class=\"m-sub\">Ciliary Body</h4><div class=\"tbl\"><table>\n<tr>\n<td>Category</td>\n<td>Key information</td>\n</tr>\n<tr>\n<td><strong>Location</strong></td>\n<td>Ring-shaped tissue behind the iris and around the lens</td>\n</tr>\n<tr>\n<td><strong>Basic function</strong></td>\n<td>Produces aqueous humor; its ciliary muscle changes lens shape during accommodation</td>\n</tr>\n<tr>\n<td><strong>Possible symptoms when affected</strong></td>\n<td>Eye pain, photophobia, blurred near vision, inflammation, or pressure changes</td>\n</tr>\n<tr>\n<td><strong>Common associated conditions</strong></td>\n<td>Anterior or intermediate uveitis, cyclitis, cyclodialysis cleft, ciliary-body tumor, accommodation problems, and ocular hypotony</td>\n</tr>\n<tr>\n<td><strong>Common evaluation methods</strong></td>\n<td>Slit-lamp examination for associated inflammation, intraocular-pressure measurement, gonioscopy, ultrasound biomicroscopy, and dilated examination</td>\n</tr>\n</table></div><p>The ciliary body participates in both aqueous production and accommodation, allowing the natural lens to adjust focus for near objects.</p><h4 class=\"m-sub\">Lens</h4><div class=\"tbl\"><table>\n<tr>\n<td>Category</td>\n<td>Key information</td>\n</tr>\n<tr>\n<td><strong>Location</strong></td>\n<td>Clear structure directly behind the iris and pupil</td>\n</tr>\n<tr>\n<td><strong>Basic function</strong></td>\n<td>Works with the cornea to focus light onto the retina and changes shape for near focusing</td>\n</tr>\n<tr>\n<td><strong>Possible symptoms when affected</strong></td>\n<td>Blurry vision, glare, halos, poor night vision, decreased contrast, double vision in one eye, or frequent prescription changes</td>\n</tr>\n<tr>\n<td><strong>Common associated conditions</strong></td>\n<td>Cataract, presbyopia, lens dislocation or subluxation, traumatic cataract, posterior capsular opacification, and aphakia</td>\n</tr>\n<tr>\n<td><strong>Common evaluation methods</strong></td>\n<td>Visual acuity, refraction, glare testing, slit-lamp examination before and after dilation, red-reflex assessment, and ocular biometry before cataract surgery</td>\n</tr>\n</table></div><p>Clouding of the natural lens is called a cataract. Lens abnormalities are generally best assessed with the slit lamp, often after pupil dilation when appropriate.</p><h3 class=\"m-sec\">Unit C: Posterior Segment</h3><p>The posterior segment is located behind the lens and includes the vitreous, retina, macula, choroid, retinal vessels, and optic nerve.</p><h3 class=\"m-sec\">Vitreous</h3><div class=\"tbl\"><table>\n<tr>\n<td>Category</td>\n<td>Key information</td>\n</tr>\n<tr>\n<td><strong>Location</strong></td>\n<td>Large cavity between the lens and retina</td>\n</tr>\n<tr>\n<td><strong>Basic function</strong></td>\n<td>Clear gel that transmits light and helps maintain the shape of the globe</td>\n</tr>\n<tr>\n<td><strong>Possible symptoms when affected</strong></td>\n<td>Floaters, flashes, haze, spots, cobwebs, or reduced vision</td>\n</tr>\n<tr>\n<td><strong>Common associated conditions</strong></td>\n<td>Posterior vitreous detachment, vitreous hemorrhage, vitreous inflammation, asteroid hyalosis, retinal tear, and retinal detachment</td>\n</tr>\n<tr>\n<td><strong>Common evaluation methods</strong></td>\n<td>Dilated fundus examination, slit-lamp biomicroscopy, indirect ophthalmoscopy, B-scan ultrasonography, and OCT for vitreoretinal-interface abnormalities</td>\n</tr>\n</table></div><p>New flashes or a sudden increase in floaters can occur with a posterior vitreous detachment but may also accompany a retinal tear or detachment, requiring prompt retinal evaluation. The vitreous is the clear gel filling most of the eye.</p><h3 class=\"m-sec\">Retina</h3><div class=\"tbl\"><table>\n<tr>\n<td>Category</td>\n<td>Key information</td>\n</tr>\n<tr>\n<td><strong>Location</strong></td>\n<td>Light-sensitive tissue lining the inside back wall of the eye</td>\n</tr>\n<tr>\n<td><strong>Basic function</strong></td>\n<td>Converts light into electrical signals that are transmitted through the optic nerve</td>\n</tr>\n<tr>\n<td><strong>Possible symptoms when affected</strong></td>\n<td>Blurry vision, flashes, floaters, distortion, missing vision, curtain-like shadow, poor night vision, or color changes</td>\n</tr>\n<tr>\n<td><strong>Common associated conditions</strong></td>\n<td>Diabetic retinopathy, retinal tear or detachment, retinal vein or artery occlusion, retinitis pigmentosa, macular degeneration, and retinal inflammation</td>\n</tr>\n<tr>\n<td><strong>Common evaluation methods</strong></td>\n<td>Dilated fundus examination, indirect ophthalmoscopy, fundus photography, OCT, fluorescein angiography, OCT angiography, visual fields, and electroretinography when indicated</td>\n</tr>\n</table></div><p>Retinal photoreceptors convert incoming light into electrical signals, which then travel toward the brain through the optic nerve.</p><h3 class=\"m-sec\">Macula</h3><div class=\"tbl\"><table>\n<tr>\n<td>Category</td>\n<td>Key information</td>\n</tr>\n<tr>\n<td><strong>Location</strong></td>\n<td>Small central region of the retina</td>\n</tr>\n<tr>\n<td><strong>Basic function</strong></td>\n<td>Provides detailed central vision needed for reading, recognizing faces, and other fine tasks</td>\n</tr>\n<tr>\n<td><strong>Possible symptoms when affected</strong></td>\n<td>Central blur, distortion, missing central area, difficulty reading, reduced contrast, or colors appearing dull</td>\n</tr>\n<tr>\n<td><strong>Common associated conditions</strong></td>\n<td>Age-related macular degeneration, diabetic macular edema, epiretinal membrane, macular hole, central serous chorioretinopathy, and retinal vein occlusion</td>\n</tr>\n<tr>\n<td><strong>Common evaluation methods</strong></td>\n<td>Visual acuity, Amsler grid, dilated examination, macular OCT, fundus photography, fluorescein angiography, and OCT angiography</td>\n</tr>\n</table></div><p>Macular disease commonly affects central detail while peripheral vision may remain relatively preserved.</p><h3 class=\"m-sec\">Fovea</h3><div class=\"tbl\"><table>\n<tr>\n<td>Category</td>\n<td>Key information</td>\n</tr>\n<tr>\n<td><strong>Location</strong></td>\n<td>Small depression at the center of the macula</td>\n</tr>\n<tr>\n<td><strong>Basic function</strong></td>\n<td>Produces the sharpest central vision and highest-resolution visual detail</td>\n</tr>\n<tr>\n<td><strong>Possible symptoms when affected</strong></td>\n<td>Marked central blur, distortion, central blind spot, reduced reading ability, or difficulty recognizing faces</td>\n</tr>\n<tr>\n<td><strong>Common associated conditions</strong></td>\n<td>Foveal-involving macular edema, macular hole, foveal scar, solar retinopathy, and foveal hypoplasia</td>\n</tr>\n<tr>\n<td><strong>Common evaluation methods</strong><
