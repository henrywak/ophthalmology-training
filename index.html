  function vIntro(){
    return '<section class="hero">'+
      '<p class="eyebrow">Pre-Clinic Training</p>'+
      '<h1 class="display">Ophthalmology Technician Training</h1>'+
      '<p class="hero__sub">A clinical foundation for new technicians &mdash; the terminology, anatomy, and workflow you&rsquo;ll build on before your in-person training begins.</p>'+
      '<button class="btn" data-nav="start">Begin '+ICON.arrow+'</button>'+
      '<p class="hero__meta">Self-paced &middot; 3 modules &middot; 26 lessons</p>'+
    '</section>';
  }

  function vStart(){
    return '<section>'+
      '<div class="titleblock"><p class="eyebrow">Get Started</p>'+
        '<h1 class="display">How this works</h1>'+
        '<p class="topic">A quick orientation before you dive in.</p></div>'+
      '<div class="what">'+
        row(ICON.book,"Work through it in order","The program is organized into modules, and each module is a short series of lessons. Read straight through &mdash; later lessons build on earlier ones.")+
        row(ICON.arrow,"Move with Next and Back","Use the Next button to advance one lesson at a time. Back returns to the previous page whenever you want to review.")+
        row(ICON.steps,"Watch the progress bar","The bar at the bottom of the screen shows how far you are through the current module.")+
        row(ICON.save,"Leave and come back","Your place is remembered on this device, so you can pause and pick up where you left off.")+
      '</div>'+
      '<div class="callout" style="margin-top:30px"><h4 class="callout__title">What this training is for</h4>'+
        '<p style="margin:0 0 .6em;color:var(--ink-2)">The goal is not for you to independently diagnose patients or make treatment decisions. It is to give you enough background to enter the clinic and adapt smoothly &mdash; understanding common terminology, recognizing the major structures of the eye, and connecting conditions with the tests and procedures used in clinic.</p></div>'+
      '<div style="margin-top:30px"><button class="btn" data-nav="home">Continue '+ICON.arrow+'</button></div>'+
    '</section>';
  }
  function row(ic,t,d){
    return '<div class="what__row"><span class="what__ic">'+ic+'</span><div><p class="what__t">'+t+'</p><p class="what__d">'+d+'</p></div></div>';
  }

  function vHome(){
    var cards = MODULES.map(function(m,i){
      var ready = m.status==="available";
      var done = isDone(m.id);
      var count = m.lessons.length;
      var pill = done ? '<span class="pill pill--done">Completed</span>'
                : ready ? '<span class="pill pill--ready">Ready</span>'
                : '<span class="pill pill--soon">Coming soon</span>';
      var meta = ready ? '<span>'+count+' lessons</span>' : '<span>In development</span>';
      return '<button class="mod'+(ready?'':' mod--soon')+'"'+(ready?' data-nav="module" data-m="'+i+'"':' disabled aria-disabled="true"')+'>'+
        '<span class="mod__num">'+m.label.replace("Module ","M")+'</span>'+
        '<span class="mod__body">'+
          '<span class="mod__title">'+m.title+'</span>'+
          '<span class="mod__desc">'+m.desc+'</span>'+
          '<span class="mod__meta">'+pill+meta+'</span>'+
        '</span>'+
        '<span class="mod__arrow">'+ICON.arrow+'</span>'+
      '</button>';
    }).join("");
    return '<section>'+
      '<div class="home-head"><p class="eyebrow">Course</p>'+
        '<h1 class="display">Choose a module</h1>'+
        '<p>Work through the modules in order. More modules will be added as the program grows.</p></div>'+
      '<div class="mods">'+cards+'</div>'+
    '</section>';
  }

  function vOverview(m){
    var mod = MODULES[m];
    var moduleDone = isDone(mod.id);
    var items = mod.lessons.map(function(l,i){
      var open = moduleDone || seen(mod.id,i);
      var icon = open ? '<span class="lcheck">'+ICON.check+'</span>'
                      : '<span class="llock" aria-label="Locked">'+ICON.lock+'</span>';
      var attrs = open ? ' class="is-open" data-nav="lesson" data-i="'+i+'" tabindex="0" role="button"'
                       : ' class="is-locked" aria-disabled="true"';
      return '<li'+attrs+'><span class="lnum">'+l.num+'</span>'+
        '<span class="ltitle">'+l.title+'</span>'+icon+'</li>';
    }).join("");
    var hint = moduleDone
      ? 'Module complete &mdash; revisit any lesson.'
      : 'Lessons unlock as you reach them. Locked lessons open once you get there.';
    return '<section>'+
      '<div class="titleblock"><p class="eyebrow">'+mod.label+'</p>'+
        '<h1 class="display">'+mod.title+'</h1></div>'+
      '<div class="prose">'+mod.overview+'</div>'+
      '<h4 style="margin:34px 0 4px;font-size:.86em;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:700">Lessons in this module</h4>'+
      '<p style="margin:0;color:var(--faint);font-size:.9rem">'+hint+'</p>'+
      '<ol class="llist" style="list-style:none">'+items+'</ol>'+
    '</section>';
  }

  function vLesson(m,i){
    var mod = MODULES[m], l = mod.lessons[i];
    return '<section>'+
      '<div class="titleblock"><p class="eyebrow">'+mod.label+' &middot; Lesson '+l.num+'</p>'+
        '<h1 class="display">'+l.title+'</h1>'+
        (l.topic?'<p class="topic">'+l.topic+'</p>':'')+'</div>'+
      '<div class="prose">'+l.body+'</div>'+
    '</section>';
  }

  function vComplete(m){
    var mod = MODULES[m];
    return '<section class="hero">'+
      '<div class="medal">'+ICON.check+'</div>'+
      '<p class="eyebrow" style="margin-top:16px">'+mod.label+' complete</p>'+
      '<h1 class="display">Nicely done.</h1>'+
      '<p class="hero__sub">You&rsquo;ve finished <strong>'+mod.title+'</strong>. Your progress is saved &mdash; return to the course home to continue, or revisit any lesson anytime.</p>'+
      '<button class="btn" data-nav="home">Back to course home '+ICON.arrow+'</button>'+
    '</section>';
  }

  /* ---------- chrome (header + footer bar) ---------- */
  function updateChrome(){
    var inModule = (state.view==="module");
    document.body.classList.toggle("has-bar", inModule);
    linkHome.hidden = !inModule;

    if(!inModule) return;
    var mod = MODULES[state.m], n = mod.lessons.length, p = state.p;
    var pct, label;

    if(p===0){ // overview
      pct=0; label="Overview \u00B7 "+mod.label;
      btnOverview.textContent = "Course home";
      btnOverview.onclick = function(){ go(function(){ state.view="home"; }); };
      btnBack.style.display = "none";
      btnNext.innerHTML = "Start module "+ICON.arrow;
      btnNext.disabled = false;
      btnNext.onclick = function(){ go(function(){ state.p=1; }); };
    } else if(p<=n){ // lesson p-1
      var i=p-1; pct=Math.round(((i+1)/n)*100);
      label="Lesson "+mod.lessons[i].num+" \u00B7 "+(i+1)+" of "+n;
      btnOverview.textContent = "Overview";
      btnOverview.onclick = function(){ go(function(){ state.p=0; }); };
      btnBack.style.display = "";
      btnBack.innerHTML = "Back";
      btnBack.disabled = (i===0);
      btnBack.onclick = function(){ if(i>0) go(function(){ state.p--; }); };
      btnNext.innerHTML = (i===n-1 ? "Finish module" : "Next")+" "+ICON.arrow;
      btnNext.disabled = false;
      btnNext.onclick = function(){ next(); };
    } else { // complete
      pct=100; label="Module complete";
      btnOverview.textContent = "Overview";
      btnOverview.onclick = function(){ go(function(){ state.p=0; }); };
      btnBack.style.display = "";
      btnBack.innerHTML = "Back";
      btnBack.disabled = false;
      btnBack.onclick = function(){ go(function(){ state.p=n; }); };
      btnNext.innerHTML = "Course home "+ICON.arrow;
      btnNext.disabled = false;
      btnNext.onclick = function(){ go(function(){ state.view="home"; }); };
    }
    barFill.style.width = pct+"%";
    barLabel.textContent = label;
    barPct.textContent = pct+"% complete";
  }

  /* ---------- render dispatch + transition ---------- */
  function html(){
    switch(state.view){
      case "intro": return vIntro();
      case "start": return vStart();
      case "home": return vHome();
      case "module":
        var n = MODULES[state.m].lessons.length;
        if(state.p===0) return vOverview(state.m);
        if(state.p<=n) return vLesson(state.m, state.p-1);
        return vComplete(state.m);
    }
    return "";
  }

  function paint(){
    stage.innerHTML = html();
    updateChrome();
    // mark lesson seen
    if(state.view==="module"){
      var n=MODULES[state.m].lessons.length;
      if(state.p>=1 && state.p<=n) markSeen(MODULES[state.m].id, state.p-1);
      if(state.p===n+1) markDone(MODULES[state.m].id);
    }
    // interactive anatomy diagram + back-to-top (Lesson 1.2 only)
    onAnatomy = isAnatomyLesson();
    if(onAnatomy) enhanceAnatomy();
    if(isAssessmentLesson()) enhanceAssessment();
    if(floatTop){ floatTop.hidden = !onAnatomy; updateFloat(); }
    savePos();
  }

  function transition(fn){
    if(reduce){ fn(); paint(); window.scrollTo(0,0); focusStage(); return; }
    if(animating) return;
    animating = true;
    stage.classList.add("is-exiting");
    var done=false;
    var swap=function(){
      if(done) return; done=true;
      fn();
      paint();
      window.scrollTo(0,0);
      stage.classList.remove("is-exiting");
      stage.classList.add("is-entering");
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        stage.classList.remove("is-entering");
        focusStage();
        animating = false;
      });});
    };
    stage.addEventListener("transitionend", swap, {once:true});
    setTimeout(swap, 460); // fallback
  }
  function focusStage(){
    var h=stage.querySelector("h1");
    if(h){ h.setAttribute("tabindex","-1"); try{h.focus({preventScroll:true});}catch(e){} }
  }

  /* ---------- navigation ---------- */
  function go(mut){ transition(mut); }

  function next(){
    var mod=MODULES[state.m], n=mod.lessons.length;
    if(state.p < n+1){ go(function(){ state.p++; }); }
    else { go(function(){ state.view="home"; }); } // from complete
  }
  function back(){
    if(state.p===0){ go(function(){ state.view="home"; }); }
    else if(state.p===MODULES[state.m].lessons.length+1){ go(function(){ state.p=0; }); } // complete -> overview
    else { go(function(){ state.p--; }); }
  }

  document.addEventListener("click", function(e){
    var eye = e.target.closest && e.target.closest(".eyelbl");
    if(eye){ scrollToAnatomy(eye.getAttribute("data-find")); return; }
    var t = e.target.closest("[data-nav]");
    if(!t || t.disabled) return;
    var nav = t.getAttribute("data-nav");
    if(nav==="start")  go(function(){ state.view="start"; });
    else if(nav==="home")   go(function(){ state.view="home"; });
    else if(nav==="module") go(function(){ state.view="module"; state.m=+t.getAttribute("data-m"); state.p=0; });
    else if(nav==="lesson"){ var li=+t.getAttribute("data-i"); go(function(){ state.p=li+1; }); }
    else if(nav==="next")   next();
    else if(nav==="back")   back();
    else if(nav==="totop")  scrollTopSmooth();
  });

  if(floatTop){ floatTop.addEventListener("click", scrollTopSmooth); }
  window.addEventListener("scroll", updateFloat, {passive:true});

  document.addEventListener("keydown", function(e){
    // activate a focused anatomy label with Enter / Space
    var eye = e.target && e.target.closest && e.target.closest(".eyelbl");
    if(eye && (e.key==="Enter" || e.key===" ")){ e.preventDefault(); scrollToAnatomy(eye.getAttribute("data-find")); return; }
    // activate a focused lesson-list item with Enter / Space
    var li = e.target && e.target.closest && e.target.closest('[data-nav="lesson"]');
    if(li && (e.key==="Enter" || e.key===" ")){ e.preventDefault(); li.click(); return; }
    if(state.view!=="module") return;
    if(li) return; // don't let arrows fire while navigating the lesson list
    if(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if(e.key==="ArrowRight") next();
    else if(e.key==="ArrowLeft") back();
  });

  // restore last position (resume), with guards
  (function restore(){
    var pos = loadPos();
    if(!pos || !pos.v) return;
    if(pos.v==="module"){
      if(typeof pos.m!=="number" || !MODULES[pos.m] || MODULES[pos.m].status!=="available") return;
      var n = MODULES[pos.m].lessons.length;
      state.view="module"; state.m=pos.m;
      state.p = Math.max(0, Math.min(n+1, pos.p||0));
    } else if(pos.v==="start" || pos.v==="home"){
      state.view = pos.v;
    }
  })();

  // first paint
  paint();
})();
</script>
</body>
</html>
