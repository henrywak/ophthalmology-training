/td>\n<td>Best-corrected visual acuity, Amsler grid, macular OCT, fundus examination, fundus photography, and angiographic testing</td>\n</tr>\n</table></div><p>Because the fovea supplies the sharpest vision, even a small foveal abnormality can significantly reduce visual acuity.</p><h3 class=\"m-sec\">Optic Disc</h3><div class=\"tbl\"><table>\n<tr>\n<td>Category</td>\n<td>Key information</td>\n</tr>\n<tr>\n<td><strong>Location</strong></td>\n<td>Visible point on the posterior retina where retinal nerve fibers and blood vessels enter or leave the eye</td>\n</tr>\n<tr>\n<td><strong>Basic function</strong></td>\n<td>Represents the front portion of the optic nerve and serves as the exit point for retinal nerve fibers</td>\n</tr>\n<tr>\n<td><strong>Possible symptoms when affected</strong></td>\n<td>Reduced vision, color desaturation, visual-field loss, transient visual obscurations, or no early symptoms</td>\n</tr>\n<tr>\n<td><strong>Common associated conditions</strong></td>\n<td>Glaucomatous cupping, optic disc edema, papilledema, optic atrophy, optic neuritis, ischemic optic neuropathy, and optic disc drusen</td>\n</tr>\n<tr>\n<td><strong>Common evaluation methods</strong></td>\n<td>Dilated fundus examination, cup-to-disc ratio assessment, optic-disc photography, OCT RNFL and ganglion-cell analysis, visual fields, color vision, and pupil testing</td>\n</tr>\n</table></div><p>The optic disc is assessed for its color, margins, swelling, pallor, hemorrhage, and amount or pattern of cupping. OCT can measure retinal nerve-fiber and ganglion-cell thickness.</p><h3 class=\"m-sec\">Optic Nerve</h3><div class=\"tbl\"><table>\n<tr>\n<td>Category</td>\n<td>Key information</td>\n</tr>\n<tr>\n<td><strong>Location</strong></td>\n<td>Extends from the back of the eyeball toward the brain</td>\n</tr>\n<tr>\n<td><strong>Basic function</strong></td>\n<td>Carries visual signals from the retina to the brain</td>\n</tr>\n<tr>\n<td><strong>Possible symptoms when affected</strong></td>\n<td>Decreased vision, loss of color intensity, visual-field defects, pain with eye movement, poor contrast, or an RAPD</td>\n</tr>\n<tr>\n<td><strong>Common associated conditions</strong></td>\n<td>Glaucoma, optic neuritis, ischemic optic neuropathy, optic atrophy, compressive optic neuropathy, toxic or nutritional optic neuropathy, and papilledema</td>\n</tr>\n<tr>\n<td><strong>Common evaluation methods</strong></td>\n<td>Visual acuity, pupil testing, color vision, visual fields, dilated optic-disc examination, OCT RNFL or ganglion-cell analysis, photography, and neuroimaging when indicated</td>\n</tr>\n</table></div><p>Optic-nerve dysfunction may produce visual loss, color-vision reduction, field defects, and an abnormal afferent pupil response.</p><h3 class=\"m-sec\">Choroid</h3><div class=\"tbl\"><table>\n<tr>\n<td>Category</td>\n<td>Key information</td>\n</tr>\n<tr>\n<td><strong>Location</strong></td>\n<td>Vascular layer between the retina and sclera</td>\n</tr>\n<tr>\n<td><strong>Basic function</strong></td>\n<td>Supplies oxygen and nutrients to the outer retina and helps absorb scattered light</td>\n</tr>\n<tr>\n<td><strong>Possible symptoms when affected</strong></td>\n<td>Blurry vision, distortion, floaters, photophobia, visual-field loss, or sometimes no symptoms</td>\n</tr>\n<tr>\n<td><strong>Common associated conditions</strong></td>\n<td>Choroiditis, choroidal neovascularization, choroidal nevus, melanoma, central serous chorioretinopathy, and choroidal detachment</td>\n</tr>\n<tr>\n<td><strong>Common evaluation methods</strong></td>\n<td>Dilated examination, fundus photography, OCT, fluorescein angiography, indocyanine green angiography, fundus autofluorescence, and B-scan ultrasonography</td>\n</tr>\n</table></div><p>The choroid forms part of the uveal tract and provides vascular support to the outer retinal tissues.</p><h3 class=\"m-sec\">Retinal Blood Vessels</h3><div class=\"tbl\"><table>\n<tr>\n<td>Category</td>\n<td>Key information</td>\n</tr>\n<tr>\n<td><strong>Location</strong></td>\n<td>Travel across the inner retinal surface and enter or leave at the optic disc</td>\n</tr>\n<tr>\n<td><strong>Basic function</strong></td>\n<td>Deliver oxygen and nutrients to the inner retina and remove deoxygenated blood</td>\n</tr>\n<tr>\n<td><strong>Possible symptoms when affected</strong></td>\n<td>Sudden or gradual blurry vision, missing areas of vision, floaters, distortion, or no early symptoms</td>\n</tr>\n<tr>\n<td><strong>Common associated conditions</strong></td>\n<td>Diabetic retinopathy, hypertensive retinopathy, retinal vein occlusion, retinal artery occlusion, retinal macroaneurysm, and neovascularization</td>\n</tr>\n<tr>\n<td><strong>Common evaluation methods</strong></td>\n<td>Dilated fundus examination, fundus photography, OCT, fluorescein angiography, OCT angiography, blood-pressure measurement, and systemic medical review</td>\n</tr>\n</table></div><p>Retinal vascular changes may provide important evidence of both ocular disease and systemic conditions such as diabetes and hypertension.</p>"},
        {num:"1.3", title:"Common Symptoms and Reasons for Visit", topic:"", body:"<p class=\"lead\">Before learning individual diseases, trainees should understand how patients typically present. Most visits begin with a symptom or a reason for follow-up, and the technician is usually the first person to record it. Recognizing common complaints &mdash; and knowing which ones are urgent &mdash; helps the technician gather the right information and flag anything that needs prompt attention.</p><p>The goal of this lesson is <strong>recognition and accurate documentation, not diagnosis</strong>.</p><h3 class=\"m-sec\">Common Chief Complaints (CC)</h3><p>A chief complaint is the main reason the patient is here, ideally recorded in the patient's own words. Each is shown with what the patient may describe and what it is <em>often related to</em>:</p><ul><li><strong>Blurred vision</strong> &mdash; out of focus at distance, near, or both; <em>often:</em> refractive error, cataract, dry eye, macular or retinal disease</li><li><strong>Dryness or irritation</strong> &mdash; gritty, burning, or scratchy feeling; <em>often:</em> dry eye, blepharitis, ocular-surface disease</li><li><strong>Foreign-body sensation (FBS)</strong> &mdash; feels like something is in the eye; <em>often:</em> dry eye, corneal abrasion, foreign body, misdirected lashes</li><li><strong>Decreased vision</strong> &mdash; vision worse than usual; <em>often:</em> cataract, retinal/macular disease, optic-nerve disease (urgent if sudden)</li><li><strong>Eye pain</strong> &mdash; aching, sharp, or deep; <em>often:</em> corneal disease, uveitis, scleritis, acute angle closure, infection</li><li><strong>Redness</strong> &mdash; one or both eyes red; <em>often:</em> conjunctivitis, dry eye, uveitis, scleritis</li><li><strong>Floaters</strong> &mdash; spots, cobwebs, or specks that drift; <em>often:</em> vitreous changes (PVD), sometimes retinal tear</li><li><strong>Flashes</strong> &mdash; brief flashes or arcs of light; <em>often:</em> vitreous/retinal traction, possible retinal tear or detachment (urgent)</li><li><strong>Distorted vision</strong> &mdash; straight lines look wavy; <em>often:</em> macular disease (AMD, macular edema, membrane, hole)</li><li><strong>Double vision</strong> &mdash; seeing two images; <em>often:</em> eye-muscle or neurologic causes (monocular double vision can be lens-related)</li><li><strong>Glare or halos</strong> &mdash; rings or starbursts around lights; <em>often:</em> cataract, corneal edema, occasionally angle issues</li><li><strong>Light sensitivity (photophobia)</strong> &mdash; light is uncomfortable; <em>often:</em> corneal disease, uveitis/iritis</li><li><strong>Loss of peripheral vision</strong> &mdash; reduced side vision; <em>often:</em> glaucoma, retinal detachment, neurologic disease</li><li><strong>Curtain or shadow over vision</strong> &mdash; dark curtain or veil across vision; <em>often:</em> possible retinal detachment (urgent)</li><li><strong>Post-operative follow-up</strong> &mdash; here after recent surgery; <em>often:</em> recent cataract or other ocular surgery</li><li><strong>Diabetic eye examination</strong> &mdash; here for a diabetic check; <em>often:</em> diabetes screening or monitoring</li></ul><h3 class=\"m-sec\">Details the Technician Should Clarify</h3><p>For any symptom, a few distinctions guide the workup and documentation:</p><ul><li><strong>One eye vs both (OD / OS / OU)</strong> &mdash; laterality affects the likely cause and is required for accurate charting and billing</li><li><strong>Sudden vs gradual onset</strong> &mdash; sudden changes are more often urgent</li><li><strong>Constant vs intermittent</strong> &mdash; helps characterize the problem</li><li><strong>Near vs distance</strong> &mdash; points toward refractive vs other causes</li><li><strong>Central vs peripheral</strong> &mdash; central loss points to the macula; peripheral loss points to glaucoma or retina</li><li><strong>Painful vs painless</strong> &mdash; painless vision loss and a painful red eye suggest very different causes</li></ul><p>Documenting laterality (OD, OS, OU) is essential &mdash; a symptom recorded without laterality is incomplete.</p><div class=\"callout callout--warn\"><h4 class=\"callout__title\">Escalate promptly</h4><blockquote><strong>Escalate right away</strong> (per clinic protocol) for: sudden vision loss; new flashes and/or a sudden increase in floaters; a curtain, veil, or shadow over the vision; severe eye pain; chemical exposure to the eye; or recent eye trauma.</blockquote><p>These may reflect conditions such as retinal detachment, acute angle-closure, or chemical injury, where timing can affect the outcome.</p></div><div class=\"callout callout--key\"><h4 class=\"callout__title\">Key takeaways</h4><ul><li>The chief complaint is the patient's main reason for the visit, ideally in their own words.</li><li>Always capture <strong>laterality</strong> and whether onset was <strong>sudden or gradual</strong>.</li><li>Sudden vision loss, new flashes/floaters, a curtain over vision, severe pain, chemical exposure, and trauma require <strong>prompt escalation</strong>.</li><li>The technician recognizes and documents symptoms but does not diagnose.</li></ul></div><div class=\"callout callout--check\"><h4 class=\"callout__title\">Knowledge check</h4><ul><li>Given a list of complaints, identify which ones require prompt escalation.</li><li>For a sample complaint, list the clarifying questions you would ask (laterality, onset, constant vs intermittent, etc.).</li><li>Match each complaint with the region of the eye it is most often associated with.</li></ul></div>"},
        {num:"1.4", title:"Common Ophthalmic Diseases", topic:"", body:"<p class=\"lead\">This lesson introduces conditions the trainee will frequently encounter, organized by the region of the eye they affect. The purpose is to connect each disease to its anatomy, symptoms, and testing &mdash; <strong>not</strong> to prepare the technician to diagnose.</p><p class=\"m-label\"><strong>Disease Teaching Template</strong></p><p>Each condition is presented using the same framework: what it is; what part of the eye it affects; why it matters; symptoms the patient may report; relevant risk factors; questions the technician should ask; relevant exam findings and common tests; treatments/procedures that may be associated; and findings that require immediate escalation.</p><h3 class=\"m-sec\">Anterior Segment Conditions</h3><h4 class=\"m-sub\">Dry Eye Syndrome</h4><ul><li><strong>What it is:</strong> Inadequate tear quantity or quality, leading to an unstable tear film.</li><li><strong>Affects:</strong> Tear film and ocular surface (cornea and conjunctiva).</li><li><strong>Why it matters:</strong> Extremely common; affects comfort and vision and can coexist with or mimic other conditions.</li><li><strong>Symptoms:</strong> Burning, grittiness, FBS, redness, fluctuating or blurred vision, paradoxical tearing, contact-lens intolerance.</li><li><strong>Risk factors:</strong> Age, screen use, low humidity, certain systemic medications (antihistamines, diuretics), prior LASIK, autoimmune disease.</li><li><strong>Technician asks:</strong> Laterality; artificial-tear use, frequency, and whether they help; prescription drops; screen time; contact-lens wear.</li><li><strong>Exam / common tests:</strong> Slit lamp, tear breakup time, fluorescein or lissamine-green staining, Schirmer testing, meibomian gland evaluation.</li><li><strong>Management:</strong> Artificial tears, warm compresses, omega-3, prescription drops (cyclosporine, lifitegrast), punctal plugs.</li><li><strong>Escalate if:</strong> White corneal spot, heavy discharge, severe pain, or sudden vision loss (suggests infection/ulcer).</li></ul><h4 class=\"m-sub\">Blepharitis</h4><ul><li><strong>What it is:</strong> Chronic inflammation of the eyelid margins.</li><li><strong>Affects:</strong> Eyelids and lashes; contributes to tear-film instability.</li><li><strong>Symptoms:</strong> Crusting, redness, irritation, FBS, burning &mdash; often worse in the morning.</li><li><strong>Risk factors:</strong> Meibomian gland dysfunction, rosacea, poor lid hygiene.</li><li><strong>Technician asks:</strong> Duration, crusting, lid-hygiene routine, associated dry-eye symptoms.</li><li><strong>Exam / common tests:</strong> Slit-lamp lid-margin examination, meibomian gland evaluation.</li><li><strong>Management:</strong> Lid hygiene and warm compresses, lid scrubs, sometimes antibiotic or anti-inflammatory drops/ointment.</li><li><strong>Escalate if:</strong> Usually routine; escalate for significant pain, vision change, or corneal involvement.</li></ul><h4 class=\"m-sub\">Conjunctivitis</h4><ul><li><strong>What it is:</strong> Inflammation of the conjunctiva &mdash; viral, bacterial, or allergic.</li><li><strong>Affects:</strong> Conjunctiva.</li><li><strong>Symptoms:</strong> Redness, discharge, itching (especially allergic), tearing, FBS.</li><li><strong>Technician asks:</strong> One or both eyes, type of discharge, itching, contact-lens use, sick contacts, allergy history, recent cold.</li><li><strong>Exam / common tests:</strong> External inspection, slit lamp, discharge assessment.</li><li><strong>Management:</strong> Depends on cause &mdash; supportive care, antihistamines (allergic), antibiotics (bacterial); viral is often self-limited. Hygiene limits spread.</li><li><strong>Escalate if:</strong> Severe pain, marked vision loss, photophobia, or corneal involvement.</li></ul><h4 class=\"m-sub\">Corneal Abrasion</h4><ul><li><strong>What it is:</strong> A scratch or epithelial defect of the cornea.</li><li><strong>Affects:</strong> Cornea (epithelium).</li><li><strong>Symptoms:</strong> Sharp pain, FBS, tearing, photophobia, redness, blurred vision.</li><li><strong>Risk factors:</strong> Trauma, contact-lens wear, foreign body.</li><li><strong>Technician asks:</strong> Mechanism and timing, contact-lens use, possible foreign body, prior episodes.</li><li><strong>Exam / common tests:</strong> Visual acuity, slit lamp with fluorescein staining.</li><li><strong>Management:</strong> Physician-directed &mdash; antibiotic drops/ointment, sometimes a bandage lens.</li><li><strong>Escalate if:</strong> Significant pain or vision loss, a white infiltrate, or a contact-lens wearer &mdash; bring to the physician promptly.</li></ul><h4 class=\"m-sub\">Keratitis</h4><ul><li><strong>What it is:</strong> Inflammation or infection of the cornea.</li><li><strong>Affects:</strong> Cornea.</li><li><strong>Why it matters:</strong> Infectious keratitis or a corneal ulcer can threaten vision and needs prompt care.</li><li><strong>Symptoms:</strong> Pain, redness, photophobia, tearing, discharge, blurred vision, sometimes a visible white spot.</li><li><strong>Risk factors:</strong> Contact-lens wear (especially overnight), trauma, ocular-surface disease.</li><li><strong>Technician asks:</strong> Contact-lens use and overnight wear, pain, discharge, onset.</li><li><strong>Exam / common tests:</strong> Visual acuity, slit lamp with fluorescein; the physician may obtain cultures.</li><li><strong>Management:</strong> Physician-directed antimicrobial therapy with close follow-up.</li><li><strong>Escalate if:</strong> White corneal infiltrate, significant pain or vision loss, or a contact-lens wearer &mdash; escalate promptly.</li></ul><h4 class=\"m-sub\">Cataract</h4><ul><li><strong>What it is:</strong> Clouding of the natural (crystalline) lens.</li><li><strong>Affects:</strong> Crystalline lens.</li><li><strong>Symptoms:</strong> Gradual blurry or cloudy vision, glare, halos, poor night vision, reduced contrast, frequent prescription changes.</li><li><strong>Risk factors:</strong> Age, diabetes, steroid use, UV exposure, trauma.</li><li><strong>Technician asks:</strong> Blurry at distance/near/both, glare worse at night, gradual worsening (check VA), prior cataract surgery in either eye, current drops.</li><li><strong>Exam / common tests:</strong> Visual acuity, refraction when ordered, slit-lamp examination, biometry before surgery.</li><li><strong>Management:</strong> Observation, updated glasses, or cataract-surgery evaluation when it affects daily activities.</li><li><strong>Escalate if:</strong> Usually routine (gradual onset).</li></ul><h4 class=\"m-sub\">Anterior Uveitis (Iritis)</h4><ul><li><strong>What it is:</strong> Inflammation of the iris and anterior chamber.</li><li><strong>Affects:</strong> Iris and anterior chamber (uvea).</li><li><strong>Symptoms:</strong> Eye pain, redness, photophobia, blurred vision &mdash; often one eye.</li><li><strong>Risk factors:</strong> Autoimmune or systemic inflammatory disease, prior episodes.</li><li><strong>Technician asks:</strong> Pain, light sensitivity, prior episodes, known systemic disease.</li><li><strong>Exam / common tests:</strong> Slit lamp (cell and flare), intraocular pressure, dilated examination.</li><li><strong>Management:</strong> Physician-directed steroid and dilating drops; IOP is monitored.</li><li><strong>Escalate if:</strong> Significant pain, photophobia, or vision loss &mdash; prompt physician evaluation.</li></ul><h3 class=\"m-sec\">Retinal and Macular Conditions</h3><h4 class=\"m-sub\">Diabetic Retinopathy</h4><ul><li><strong>What it is:</strong> Damage to the retinal blood vessels caused by diabetes.</li><li><strong>Affects:</strong> Retina (retinal vessels); can involve the macula.</li><li><strong>Why it matters:</strong> A leading cause of vision loss; often silent until advanced.</li><li><strong>Symptoms:</strong> Often none early; later blurred vision, floaters, or dark areas; a sudden change may occur with bleeding.</li><li><strong>Risk factors:</strong> Duration of diabetes, poor glucose control, hypertension.</li><li><strong>Technician asks:</strong> Type and duration of diabetes, recent A1c or blood sugar, insulin/medications, prior injections or laser, vision changes.</li><li><strong>Exam / common tests:</strong> Dilated examination, fundus photography, OCT macula, fluorescein angiography.</li><li><strong>Management:</strong> Glucose control and monitoring; injections, laser (PRP), or surgery for advanced disease.</li><li><strong>Escalate if:</strong> Sudden vision loss, sudden floaters/flashes, or a curtain (possible vitreous hemorrhage or detachment).</li></ul><h4 class=\"m-sub\">Diabetic Macular Edema (DME)</h4><ul><li><strong>What it is:</strong> Fluid and swelling in the macula from diabetic vascular leakage.</li><li><strong>Affects:</strong> Macula.</li><li><strong>Symptoms:</strong> Central blur, distortion, reduced reading vision.</li><li><strong>Technician asks:</strong> Diabetes duration and control, prior injections, vision changes, Amsler changes.</li><li><strong>Exam / common tests:</strong> Visual acuity, OCT macula, dilated examination, fluorescein angiography.</li><li><strong>Management:</strong> Anti-VEGF injections; sometimes laser or steroids.</li><li><strong>Escalate if:</strong> Rapid drop in central vision.</li></ul><h4 class=\"m-sub\">Age-Related Macular Degeneration (AMD)</h4><ul><li><strong>What it is:</strong> Age-related degeneration of the macula (dry or wet forms).</li><li><strong>Affects:</strong> Macula.</li><li><strong>Symptoms:</strong> Central blur, distortion (wavy lines), reduced contrast; wet AMD can cause sudden central change.</li><li><strong>Risk factors:</strong> Age, smoking, family history.</li><li><strong>Technician asks:</strong> New distortion, Amsler changes, which eye was treated, prior injections, smoking history.</li><li><strong>Exam / common tests:</strong> Visual acuity, Amsler grid, OCT macula, fundus photography, fluorescein angiography.</li><li><strong>Management:</strong> Dry &mdash; monitoring and AREDS-type vitamins; wet &mdash; anti-VEGF injections.</li><li><strong>Escalate if:</strong> New or sudden distortion or central vision loss (possible conversion to wet AMD).</li></ul><h4 class=\"m-sub\">Macular Drusen</h4><ul><li><strong>What it is:</strong> Yellow deposits under the retina, often an early AMD finding.</li><li><strong>Affects:</strong> Macula.</li><li><strong>Symptoms:</strong> Often none; may be charted under blurry vision.</li><li><strong>Technician asks:</strong> Distortion, Amsler changes, family history.</li><li><strong>Exam / common tests:</strong> Dilated examination, fundus photography, OCT macula.</li><li><strong>Management:</strong> Monitoring; risk-factor modification.</li><li><strong>Escalate if:</strong> New distortion or central changes.</li></ul><h4 class=\"m-sub\">Epiretinal Membrane (ERM)</h4><ul><li><strong>What it is:</strong> A thin scar-like membrane on the macular surface.</li><li><strong>Affects:</strong> Macular surface.</li><li><strong>Symptoms:</strong> Blurred or distorted central vision.</li><li><strong>Exam / common tests:</strong> Visual acuity, OCT macula, dilated examination.</li><li><strong>Management:</strong> Observation; surgery (membrane peel) if significant.</li><li><strong>Escalate if:</strong> Usually routine.</li></ul><h4 class=\"m-sub\">Macular Hole</h4><ul><li><strong>What it is:</strong> A partial- or full-thickness defect in the central macula.</li><li><strong>Affects:</strong> Fovea and macula.</li><li><strong>Symptoms:</strong> Central blur, distortion, a central blind spot.</li><li><strong>Exam / common tests:</strong> Visual acuity, OCT macula, dilated examination.</li><li><strong>Management:</strong> Often surgery (vitrectomy).</li><li><strong>Escalate if:</strong> New or worsening central vision loss &mdash; prompt evaluation.</li></ul><h4 class=\"m-sub\">Retinal Tear</h4><ul><li><strong>What it is:</strong> A break in the retina, often from vitreous traction.</li><li><strong>Affects:</strong> Retina (often peripheral).</li><li><strong>Why it matters:</strong> Can progress to retinal detachment.</li><li><strong>Symptoms:</strong> New flashes and floaters; sometimes none.</li><li><strong>Technician asks:</strong> Which eye, onset, flashes/floaters, curtain, trauma, prior tear or detachment.</li><li><strong>Exam / common tests:</strong> Dilated retinal examination, indirect ophthalmoscopy.</li><li><strong>Management:</strong> Laser or cryotherapy to seal the tear.</li><li><strong>Escalate if:</strong> New flashes/floaters or a curtain &mdash; prompt retinal evaluation.</li></ul><h4 class=\"m-sub\">Retinal Detachment</h4><ul><li><strong>What it is:</strong> Separation of the retina from the back wall of the eye.</li><li><strong>Affects:</strong> Retina.</li><li><strong>Why it matters:</strong> An emergency &mdash; can cause permanent vision loss.</li><li><strong>Symptoms:</strong> Flashes, a shower of floaters, a curtain or shadow, peripheral or central vision loss.</li><li><strong>Technician asks:</strong> Onset, curtain/shadow, which eye, trauma, prior detachment.</li><li><strong>Exam / common tests:</strong> Dilated retinal examination; B-scan if the view is obscured.</li><li><strong>Management:</strong> Urgent surgery or laser.</li><li><strong>Escalate if:</strong> Suspected detachment &mdash; escalate immediately.</li></ul><h4 class=\"m-sub\">Retinal Vein Occlusion (RVO)</h4><ul><li><strong>What it is:</strong> Blockage of a retinal vein (branch or central).</li><li><strong>Affects:</strong> Retinal vessels; often the macula.</li><li><strong>Symptoms:</strong> Sudden, painless blurred or missing vision; may be partial.</li><li><strong>Risk factors:</strong> Hypertension, diabetes, glaucoma, age.</li><li><strong>Technician asks:</strong> Onset (sudden?), which eye, systemic history (blood pressure, diabetes).</li><li><strong>Exam / common tests:</strong> Dilated examination, fundus photography, OCT macula, fluorescein angiography.</li><li><strong>Management:</strong> Anti-VEGF injections, laser; manage systemic risk factors.</li><li><strong>Escalate if:</strong> Sudden vision loss &mdash; prompt evaluation.</li></ul><h3 class=\"m-sec\">Optic Nerve and Neurologic Conditions</h3><h4 class=\"m-sub\">Optic Neuropathy</h4><ul><li><strong>What it is:</strong> Damage or dysfunction of the optic nerve from various causes.</li><li><strong>Affects:</strong> Optic nerve.</li><li><strong>Symptoms:</strong> Decreased vision, reduced color intensity, visual-field loss, an RAPD.</li><li><strong>Technician asks:</strong> Onset, one or both eyes, pain with movement, color changes, systemic history.</li><li><strong>Exam / common tests:</strong> Visual acuity, pupil testing (RAPD), color vision, visual fields, OCT RNFL, dilated disc exam; neuroimaging when ordered.</li><li><strong>Management:</strong> Depends on the cause; directed by the physician.</li><li><strong>Escalate if:</strong> Sudden vision loss or a new RAPD &mdash; prompt evaluation.</li></ul><h4 class=\"m-sub\">Optic Neuritis</h4><ul><li><strong>What it is:</strong> Inflammation of the optic nerve, often in younger patients; can be associated with multiple sclerosis.</li><li><strong>Affects:</strong> Optic nerve.</li><li><strong>Symptoms:</strong> Vision loss over hours to days, pain with eye movement, reduced color vision, an RAPD.</li><li><strong>Technician asks:</strong> Onset, pain with movement, color desaturation, neurologic history.</li><li><strong>Exam / common tests:</strong> Visual acuity, pupil testing (RAPD), color vision, visual fields, OCT; MRI is often ordered.</li><li><strong>Management:</strong> Physician-directed (may include steroids); neurology involvement.</li><li><strong>Escalate if:</strong> Acute vision loss with pain &mdash; prompt evaluation.</li></ul><h4 class=\"m-sub\">Papilledema</h4><ul><li><strong>What it is:</strong> Optic-disc swelling from raised intracranial pressure, usually in both eyes.</li><li><strong>Affects:</strong> Optic disc and nerve.</li><li><strong>Why it matters:</strong> May signal a serious neurologic cause.</li><li><strong>Symptoms:</strong> Often normal vision early; headaches, transient visual obscurations, later field loss.</li><li><strong>Technician asks:</strong> Headaches, transient vision blackouts, both eyes, neurologic symptoms.</li><li><strong>Exam / common tests:</strong> Dilated disc exam, disc photography, OCT RNFL, visual fields; neuroimaging.</li><li><strong>Management:</strong> Directed at the underlying cause (physician/neurology).</li><li><strong>Escalate if:</strong> Suspected papilledema &mdash; prompt evaluation.</li></ul><h4 class=\"m-sub\">Visual Field Defects</h4><ul><li><strong>What it is:</strong> Areas of reduced or absent vision on field testing (a finding, not one disease).</li><li><strong>Affects:</strong> Anywhere along the visual pathway (retina, optic nerve, chiasm, brain).</li><li><strong>Symptoms:</strong> Missing areas of vision, bumping into objects, loss on one side; sometimes unnoticed.</li><li><strong>Technician asks:</strong> Which side, onset, neurologic symptoms.</li><li><strong>Exam / common tests:</strong> Confrontation fields, automated perimetry (e.g., 92083), OCT.</li><li><strong>Management:</strong> Depends on the cause.</li><li><strong>Escalate if:</strong> Sudden field loss (possible stroke or detachment) &mdash; prompt evaluation.</li></ul><h3 class=\"m-sec\">Glaucoma-Related Conditions</h3><h4 class=\"m-sub\">Glaucoma Suspect</h4><ul><li><strong>What it is:</strong> Findings that raise concern for glaucoma without confirmed damage (borderline IOP, suspicious disc).</li><li><strong>Affects:</strong> Optic nerve and drainage system.</li><li><strong>Symptoms:</strong> Usually none.</li><li><strong>Technician asks:</strong> Family history of glaucoma, current drops, prior IOP readings.</li><li><strong>Exam / common tests:</strong> IOP, OCT nerve/RNFL, visual field, pachymetry, gonioscopy, fundus photography, dilated disc exam.</li><li><strong>Management:</strong> Monitoring; treat if it progresses.</li><li><strong>Escalate if:</strong> Very high IOP or acute symptoms.</li></ul><h4 class=\"m-sub\">Ocular Hypertension</h4><ul><li><strong>What it is:</strong> Elevated IOP without optic-nerve damage or field loss.</li><li><strong>Affects:</strong> Aqueous dynamics and IOP.</li><li><strong>Symptoms:</strong> Usually none.</li><li><strong>Technician asks:</strong> Current drops, family history, prior IOP.</li><li><strong>Exam / common tests:</strong> IOP (often applanation to confirm), pachymetry, OCT nerve, visual field, disc exam.</li><li><strong>Management:</strong> Monitoring; sometimes pressure-lowering drops.</li><li><strong>Escalate if:</strong> Very high IOP &mdash; confirm and notify the physician.</li></ul><h4 class=\"m-sub\">Primary Open-Angle Glaucoma (POAG)</h4><ul><li><strong>What it is:</strong> Chronic optic-nerve damage with an open drainage angle, usually with elevated IOP.</li><li><strong>Affects:</strong> Optic nerve; drainage through the trabecular meshwork.</li><li><strong>Why it matters:</strong> A leading cause of irreversible vision loss; usually painless and gradual.</li><li><strong>Symptoms:</strong> Often asymptomatic until advanced, then peripheral field loss.</li><li><strong>Risk factors:</strong> Age, family history, elevated IOP, race, thin corneas.</li><li><strong>Technician asks:</strong> Which drops and which eye, compliance, prior laser or surgery, family history.</li><li><strong>Exam / common tests:</strong> IOP (iCare or Goldmann), OCT RNFL, visual field, pachymetry, gonioscopy, fundus photography.</li><li><strong>Management:</strong> Pressure-lowering drops, laser (SLT), or surgery.</li><li><strong>Escalate if:</strong> Very high IOP or a rapid change.</li></ul><h4 class=\"m-sub\">Narrow Angles / Angle-Closure Risk</h4><ul><li><strong>What it is:</strong> An anatomically narrow drainage angle at risk of closing.</li><li><strong>Affects:</strong> Anterior chamber angle.</li><li><strong>Why it matters:</strong> Acute angle closure is an emergency.</li><li><strong>Symptoms:</strong> Often none when simply narrow; acute closure causes severe pain, headache, halos, redness, blurred vision, and nausea/vomiting.</li><li><strong>Technician asks:</strong> Prior angle closure, symptoms in dim light, family history; <strong>check before dilating</strong>.</li><li><strong>Exam / common tests:</strong> Gonioscopy, Van Herick estimation, anterior-segment OCT, IOP.</li><li><strong>Management:</strong> Laser peripheral iridotomy (LPI) to prevent closure.</li><li><strong>Escalate if:</strong> Acute painful red eye with high IOP &mdash; emergency. Do not dilate suspected narrow angles without physician approval.</li></ul><h4 class=\"m-sub\">Secondary Glaucoma</h4><ul><li><strong>What it is:</strong> Glaucoma caused by another condition (inflammation, trauma, steroids, neovascularization).</li><li><strong>Affects:</strong> Drainage system and optic nerve.</li><li><strong>Symptoms:</strong> Vary; may include pain and redness (e.g., neovascular glaucoma) or be silent.</li><li><strong>Technician asks:</strong> Steroid use, prior trauma, uveitis, diabetes (neovascular risk), prior surgery.</li><li><strong>Exam / common tests:</strong> IOP, gonioscopy, slit lamp, OCT nerve, visual field, dilated exam.</li><li><strong>Management:</strong> Treat the underlying cause plus pressure control.</li><li><strong>Escalate if:</strong> Very high IOP or a painful red eye.</li></ul><div class=\"callout callout--key\"><h4 class=\"callout__title\">Key takeaways</h4><ul><li>Conditions are grouped by the region they affect: anterior segment, retina/macula, optic nerve, and glaucoma.</li><li>Many serious conditions (glaucoma, diabetic retinopathy) are painless and silent early &mdash; history and testing matter.</li><li>Flashes, floaters, a curtain or shadow, sudden vision loss, and an acute painful red eye require prompt escalation.</li><li>The technician gathers history and performs assigned testing but does not diagnose.</li></ul></div><div class=\"callout callout--check\"><h4 class=\"callout__title\">Knowledge check</h4><ul><li>Match each condition to the region of the eye it affects.</li><li>For a given condition, list the technician questions and common tests.</li><li>Identify which conditions commonly present with no early symptoms.</li><li>Identify which presentations require immediate escalation.</li></ul></div>"},
        {num:"1.5", title:"Diagnostic Instruments and Testing", topic:"", body:"<p class=\"lead\">Instruments are taught after the trainee understands the anatomy and the diseases being evaluated. A test may help assess <strong>vision, eye pressure, corneal shape or thickness, the anterior chamber angle, optic-nerve structure, retinal structure, retinal circulation, peripheral vision, and progression over time</strong>.</p><p class=\"m-label\"><strong>Instrument Teaching Template</strong></p><p>Each instrument is presented with: what it measures or images; the structure or condition evaluated; why a physician may order it; basic patient instructions; positioning; common sources of inaccurate results; what a good-quality result looks like; when to repeat or escalate; the related CPT code when appropriate; and a reminder to follow clinic-specific cleaning and protocol.</p><blockquote>Detailed hands-on operation is taught later and reinforced through supervised in-person training. <strong>Cleaning and infection control follow clinic protocol for every instrument.</strong></blockquote><h3 class=\"m-sec\">Basic Testing</h3><h4 class=\"m-sub\">Visual Acuity (VA)</h4><ul><li><strong>Measures:</strong> Clarity of central vision at distance and/or near.</li><li><strong>Evaluates:</strong> Overall visual function (affected by many conditions).</li><li><strong>Why ordered:</strong> Baseline for nearly every visit; tracks change over time.</li><li><strong>Patient instructions:</strong> Cover one eye and read the smallest line you can &mdash; with correction (cc) and/or without (sc); pinhole (PH) if reduced.</li><li><strong>Positioning / accuracy:</strong> Correct test distance and proper occlusion; errors come from peeking, wrong distance, or not using correction.</li><li><strong>Good result / escalate:</strong> A consistent best-effort line per eye, labeled cc/sc/PH; recheck if inconsistent and flag sudden large drops.</li><li><strong>Coding:</strong> Part of the exam (not billed separately).</li></ul><h4 class=\"m-sub\">Intraocular Pressure &mdash; Tonometry (iCare / non-contact)</h4><ul><li><strong>Measures:</strong> Eye pressure in mmHg (standard range \\\\~10&ndash;21, varies by person).</li><li><strong>Evaluates:</strong> Glaucoma, ocular hypertension, steroid response, post-op pressure.</li><li><strong>Why ordered:</strong> Screening and monitoring; part of most exams.</li><li><strong>Patient instructions:</strong> Look straight ahead and stay relaxed; do not hold your breath or squeeze.</li><li><strong>Positioning / accuracy:</strong> Aligned, loosen tight collars; errors from squeezing, breath-holding, or poor alignment.</li><li><strong>Good result / escalate:</strong> Consistent readings; if high or unusual, remeasure and consider applanation, and notify the physician if very high.</li><li><strong>Coding:</strong> Part of the exam.</li></ul><h4 class=\"m-sub\">Autorefractor</h4><ul><li><strong>Measures:</strong> An estimate of the refractive error (a starting glasses prescription).</li><li><strong>Evaluates:</strong> Refractive status; a starting point for the doctor's refraction.</li><li><strong>Why ordered:</strong> To speed and guide refraction, often before comprehensive exams.</li><li><strong>Patient instructions:</strong> Look at the target, keep eyes open and steady, blink normally.</li><li><strong>Accuracy:</strong> Errors from blinking, poor fixation, dry eyes, or small pupils.</li><li><strong>Coding:</strong> Refraction is <strong>92015</strong> (patient often pays; not covered by Original Medicare). The doctor refines it with a subjective refraction.</li></ul><h4 class=\"m-sub\">Pachymeter</h4><ul><li><strong>Measures:</strong> Corneal thickness in microns.</li><li><strong>Evaluates:</strong> Glaucoma / ocular-hypertension risk and corneal disease; affects how IOP is interpreted.</li><li><strong>Why ordered:</strong> Baseline for glaucoma workups; corneal disease.</li><li><strong>Patient instructions:</strong> A numbing drop is used (contact method); look straight ahead.</li><li><strong>Accuracy:</strong> Center on the cornea; errors from off-center readings or poor contact.</li><li><strong>Coding:</strong> <strong>76514</strong> &mdash; billed once for both eyes; Medicare covers it once per lifetime for the glaucoma/ocular-hypertension indication.</li></ul><h4 class=\"m-sub\">Slit Lamp</h4><ul><li><strong>Views:</strong> Magnified view of the lids, lashes, conjunctiva, cornea, anterior chamber, iris, and lens (and, with added lenses, the retina).</li><li><strong>Evaluates:</strong> Nearly all anterior-segment structures and disease.</li><li><strong>Why ordered:</strong> A core part of the eye exam.</li><li><strong>Patient instructions:</strong> Chin in the rest, forehead forward, look as directed.</li><li><strong>Accuracy:</strong> Errors from poor positioning or unsteady fixation.</li><li><strong>Coding:</strong> Part of the physician's exam.</li></ul><h3 class=\"m-sec\">Glaucoma Testing</h3><h4 class=\"m-sub\">Goldmann Applanation Tonometry</h4><ul><li><strong>Measures:</strong> IOP by flattening a small area of the cornea &mdash; the gold standard.</li><li><strong>Evaluates:</strong> Confirms IOP, especially when another method reads high or unusual.</li><li><strong>Why ordered:</strong> Glaucoma, steroid responders, unusual iCare readings, physician preference.</li><li><strong>Patient instructions:</strong> A numbing drop plus fluorescein is used; look straight ahead and stay still.</li><li><strong>Accuracy:</strong> Errors from squeezing, breath-holding, too much/little fluorescein, or misaligned mires.</li><li><strong>Coding:</strong> Part of the exam.</li></ul><h4 class=\"m-sub\">OCT &mdash; Optic Nerve / RNFL</h4><ul><li><strong>Images:</strong> Cross-section of the optic nerve and retinal nerve-fiber layer.</li><li><strong>Evaluates:</strong> Glaucoma and optic-nerve disease; tracks progression.</li><li><strong>Why ordered:</strong> Glaucoma diagnosis and monitoring.</li><li><strong>Patient instructions:</strong> Look at the target, hold still, blink between scans.</li><li><strong>Accuracy / good result:</strong> Good signal strength, centered, no motion artifact; errors from blinking, movement, or media opacity.</li><li><strong>Coding:</strong> <strong>92133</strong> (92133 and 92134 cannot be billed the same day).</li></ul><h4 class=\"m-sub\">Visual Field Analyzer (Automated Perimetry)</h4><ul><li><strong>Measures:</strong> Sensitivity of the visual field (a functional test).</li><li><strong>Evaluates:</strong> Glaucoma and neurologic disease; maps field loss.</li><li><strong>Why ordered:</strong> Glaucoma monitoring; field defects.</li><li><strong>Patient instructions:</strong> Keep looking at the central target and press the button whenever you see a light &mdash; do not search for the lights.</li><li><strong>Accuracy / good result:</strong> Correct trial lens, other eye patched, low fixation losses and false responses; errors from fatigue, wrong lens, or a drooping lid.</li><li><strong>Coding:</strong> <strong>92083</strong> (extended). Best done before dilation for consistency.</li></ul><h4 class=\"m-sub\">Gonioscopy</h4><ul><li><strong>Views:</strong> The anterior chamber angle and its drainage structures.</li><li><strong>Evaluates:</strong> Narrow angles and angle-closure risk (open vs closed).</li><li><strong>Why ordered:</strong> Glaucoma workup; before or after certain procedures.</li><li><strong>Patient instructions:</strong> A numbing drop is used; hold still while a mirrored lens gently touches the eye.</li><li><strong>Note:</strong> Performed by the physician; done <strong>before</strong> dilation.</li><li><strong>Coding:</strong> <strong>92020</strong>.</li></ul><h4 class=\"m-sub\">Fundus Photography</h4><ul><li><strong>Images:</strong> Color photographs of the optic nerve, retina, and macula.</li><li><strong>Evaluates:</strong> Documents and monitors optic-nerve, retinal, and macular disease.</li><li><strong>Why ordered:</strong> Glaucoma, diabetes, and AMD documentation.</li><li><strong>Patient instructions:</strong> Look at the target; images are clearer when dilated.</li><li><strong>Accuracy:</strong> Errors from blinking, a small pupil, or media opacity.</li><li><strong>Coding:</strong> <strong>92250</strong> &mdash; a photo, not a cross-section (different from OCT).</li></ul><h3 class=\"m-sec\">Retinal and Macular Testing</h3><p><em>(Fundus photography, covered above, is also central to retinal and macular documentation.)</em></p><h4 class=\"m-sub\">OCT &mdash; Macula</h4><ul><li><strong>Images:</strong> Cross-section of the macula and retina.</li><li><strong>Evaluates:</strong> Macular edema, AMD, epiretinal membrane, macular hole, diabetic macular edema.</li><li><strong>Why ordered:</strong> Diagnosis and monitoring of macular/retinal disease.</li><li><strong>Patient instructions:</strong> Look at the target, hold still, blink between scans.</li><li><strong>Accuracy / good result:</strong> Good signal strength, centered, no motion artifact.</li><li><strong>Coding:</strong> <strong>92134</strong> (cannot be billed the same day as 92133).</li></ul><h4 class=\"m-sub\">Fluorescein Angiography (FA)</h4><ul><li><strong>Images:</strong> Dye-based imaging of retinal blood flow and leakage.</li><li><strong>Evaluates:</strong> Diabetic retinopathy, vein occlusion, AMD &mdash; circulation, leakage, and ischemia.</li><li><strong>Why ordered:</strong> To map retinal circulation and leakage.</li><li><strong>Patient instructions:</strong> Dye is injected in the arm and a series of photos is taken; skin/urine may briefly turn yellow-orange. Ask about allergies and report nausea or itching.</li><li><strong>Accuracy / escalate:</strong> Correct frame timing and dilation; watch for an allergic reaction or nausea during the test and notify per clinic protocol.</li><li><strong>Coding:</strong> <strong>92235</strong>.</li></ul><h4 class=\"m-sub\">Amsler Grid</h4><ul><li><strong>Measures:</strong> Central-vision distortion or missing areas (a simple functional test).</li><li><strong>Evaluates:</strong> Macular disease (AMD, DME, other macular changes).</li><li><strong>Why ordered:</strong> To screen for and monitor central distortion.</li><li><strong>Patient instructions:</strong> Wear reading correction, cover one eye, stare at the center dot, and report any wavy or missing areas.</li><li><strong>Coding:</strong> Part of the exam.</li></ul><h3 class=\"m-sec\">Cataract and Surgical-Planning Testing</h3><h4 class=\"m-sub\">Corneal Topographer</h4><ul><li><strong>Images:</strong> A map of the corneal surface shape and curvature.</li><li><strong>Evaluates:</strong> Astigmatism, keratoconus, or an irregular cornea; surgical and IOL planning.</li><li><strong>Why ordered:</strong> Cataract or refractive-surgery planning; corneal disease.</li><li><strong>Patient instructions:</strong> Look at the target and keep the eyes wide and still.</li><li><strong>Coding:</strong> <strong>92025</strong>.</li></ul><h4 class=\"m-sub\">Ocular Biometry (IOLMaster)</h4><ul><li><strong>Measures:</strong> Axial length and keratometry to calculate intraocular-lens (IOL) power.</li><li><strong>Evaluates:</strong> The eye's measurements before cataract surgery.</li><li><strong>Why ordered:</strong> Cataract surgical planning (before 66984).</li><li><strong>Patient instructions:</strong> Look at the target and hold still.</li><li><strong>Coding:</strong> <strong>92136</strong>. <em>(The autorefractor, covered above, is also used in this workflow.)</em></li></ul><h3 class=\"m-sec\">CPT Code Teaching</h3><p>For each code, learn the <strong>code number</strong>, a <strong>plain-language description</strong>, and the <strong>related test or service</strong>:</p><ul><li><strong>92015</strong> &mdash; Refraction (glasses/contact prescription)</li><li><strong>76514</strong> &mdash; Corneal pachymetry (corneal thickness)</li><li><strong>92020</strong> &mdash; Gonioscopy (drainage angle)</li><li><strong>92083</strong> &mdash; Visual field, extended/threshold</li><li><strong>92133</strong> &mdash; OCT of the optic nerve / RNFL</li><li><strong>92134</strong> &mdash; OCT of the macula / retina</li><li><strong>92250</strong> &mdash; Fundus photography</li><li><strong>92235</strong> &mdash; Fluorescein angiography</li><li><strong>92025</strong> &mdash; Corneal topography</li><li><strong>92136</strong> &mdash; Ocular biometry (IOL power)</li></ul><p><em>Frequency and payer coverage vary &mdash; confirm with the clinic's billing team.</em></p><div class=\"callout callout--key\"><h4 class=\"callout__title\">Key takeaways</h4><ul><li>Some tests measure <strong>structure</strong> (OCT, photography, pachymetry, topography, biometry); others measure <strong>function</strong> (visual acuity, visual field, Amsler grid).</li><li>Result quality depends on positioning, fixation, and signal quality &mdash; recognizing a poor-quality test is part of the technician's role.</li><li>A test is ordered to answer a specific question about a structure or condition.</li><li>Cleaning and infection control follow clinic protocol for every instrument.</li></ul></div><div class=\"callout callout--check\"><h4 class=\"callout__title\">Knowledge check</h4><ul><li>Match each instrument to the structure or condition it evaluates.</li><li>Identify whether a test measures structure or function.</li><li>Match each test to its CPT code.</li><li>Given a diagnosis, choose the tests most likely to be ordered.</li></ul></div>"},
        {num:"1.6", title:"Connecting Diseases and Tests", topic:"", body:"<p class=\"lead\">This lesson helps trainees actively connect the concepts from the previous lessons &mdash; linking each condition to the <strong>anatomy</strong> it affects, the <strong>symptoms</strong> it may cause, and the <strong>tests</strong> commonly used to evaluate it.</p><h3 class=\"m-sec\">Condition &rarr; Anatomy &rarr; Symptoms &rarr; Tests</h3><ul><li><strong>Cataract</strong> &mdash; <em>Anatomy:</em> crystalline lens &middot; <em>Symptoms:</em> cloudy or blurry vision, glare, halos &middot; <em>Common tests:</em> visual acuity, refraction, slit lamp, biometry before surgery</li><li><strong>Glaucoma (POAG)</strong> &mdash; <em>Anatomy:</em> optic nerve and drainage system &middot; <em>Symptoms:</em> often asymptomatic (very gradual) &middot; <em>Common tests:</em> IOP/Goldmann, OCT nerve, visual field, pachymetry, gonioscopy, fundus photos</li><li><strong>Diabetic retinopathy</strong> &mdash; <em>Anatomy:</em> retinal vessels and macula &middot; <em>Symptoms:</em> often asymptomatic or blur &middot; <em>Common tests:</em> dilated exam, fundus photos, OCT macula, fluorescein angiography</li><li><strong>Diabetic macular edema</strong> &mdash; <em>Anatomy:</em> macula &middot; <em>Symptoms:</em> central blur or distortion &middot; <em>Common tests:</em> OCT macula, fluorescein angiography</li><li><strong>AMD</strong> &mdash; <em>Anatomy:</em> macula &middot; <em>Symptoms:</em> central blur or distortion &middot; <em>Common tests:</em> visual acuity, Amsler grid, OCT macula, fundus photos, fluorescein angiography</li><li><strong>Retinal tear</strong> &mdash; <em>Anatomy:</em> peripheral retina &middot; <em>Symptoms:</em> flashes, floaters &middot; <em>Common tests:</em> dilated retinal exam, retinal imaging</li><li><strong>Retinal detachment</strong> &mdash; <em>Anatomy:</em> retina &middot; <em>Symptoms:</em> flashes, floaters, curtain or shadow &middot; <em>Common tests:</em> dilated retinal exam, B-scan when the view is obscured</li><li><strong>Retinal vein occlusion</strong> &mdash; <em>Anatomy:</em> retinal vessels and macula &middot; <em>Symptoms:</em> sudden painless blur &middot; <em>Common tests:</em> dilated exam, OCT macula, fluorescein angiography</li><li><strong>Dry eye</strong> &mdash; <em>Anatomy:</em> tear film and ocular surface &middot; <em>Symptoms:</em> burning, grittiness, fluctuating vision &middot; <em>Common tests:</em> slit lamp, tear breakup time, staining, Schirmer</li><li><strong>Narrow angles / angle closure</strong> &mdash; <em>Anatomy:</em> anterior chamber angle &middot; <em>Symptoms:</em> often none; acute closure is painful &middot; <em>Common tests:</em> gonioscopy, IOP, anterior-segment OCT</li><li><strong>Optic neuritis / optic neuropathy</strong> &mdash; <em>Anatomy:</em> optic nerve &middot; <em>Symptoms:</em> vision loss, reduced color, an RAPD &middot; <em>Common tests:</em> visual acuity, pupil testing, color vision, visual field, OCT, MRI when ordered</li></ul><h3 class=\"m-sec\">Structure vs Function &mdash; a Useful Distinction</h3><ul><li><strong>Structure tests</strong> show what the tissue looks like: OCT, fundus photography, pachymetry, topography, biometry.</li><li><strong>Function tests</strong> show how well the eye works: visual acuity, visual field, Amsler grid.</li><li>Many conditions are followed with <strong>both</strong> &mdash; for example, glaucoma uses OCT (structure) and visual fields (function).</li></ul><h3 class=\"m-sec\">Practice Activities</h3><ul><li>Match each disease with the anatomy it affects.</li><li>Match each disease with the appropriate test.</li><li>Identify whether a given test evaluates structure or function.</li><li>Review a mock reason-for-visit and choose the likely initial workup.</li></ul><div class=\"callout callout--check\"><h4 class=\"callout__title\">Knowledge check</h4><ul><li>For a given diagnosis, name the affected anatomy, one common symptom, and one common test.</li><li>Given a symptom (e.g., a curtain over vision), name the condition to rule out and the urgency.</li><li>Sort a mixed list of tests into structure vs function.</li></ul></div>"},
        {num:"1.7", title:"Common Ophthalmic Procedures", topic:"", body:"<p class=\"lead\">Procedures are introduced only after trainees understand the related disease and testing. The technician's role centers on <strong>preparation, required testing, consent and logistics, and post-procedure education</strong> &mdash; always following clinic protocol.</p><p class=\"m-label\"><strong>Procedure Teaching Template</strong></p><p>Each procedure is presented with: full name and abbreviation; the condition commonly treated; basic purpose; relevant anatomy; what the patient may experience; technician preparation; required testing or medication per protocol; post-procedure instructions; common or warning symptoms; and the related CPT code.</p><blockquote>CPT codes below that are marked <em>\"confirm with billing\"</em> vary by clinic and payer. Confirm all coding locally.</blockquote><h3 class=\"m-sec\">Laser Procedures</h3><h4 class=\"m-sub\">Selective Laser Trabeculoplasty (SLT)</h4><ul><li><strong>Treats:</strong> Open-angle glaucoma or ocular hypertension.</li><li><strong>Purpose / anatomy:</strong> Laser to the <strong>trabecular meshwork</strong> to improve aqueous outflow and lower IOP.</li><li><strong>Patient may experience:</strong> Brief light flashes and mild pressure; usually painless.</li><li><strong>Technician preparation:</strong> Consent review, transportation, pre-procedure drops &mdash; <strong>ONLY NUMBING (proparacaine)</strong>, and setting up the SLT machine.</li><li><strong>Testing / post-procedure:</strong> A post-laser IOP check is often done \\\\~30&ndash;60 min after; anti-inflammatory drops, avoid rubbing the eye, and attend follow-up.</li><li><strong>Warning symptoms:</strong> Significant pain, vision loss, or a large IOP spike.</li><li><strong>Coding:</strong> <strong>65855</strong>.</li></ul><h4 class=\"m-sub\">Laser Peripheral Iridotomy (LPI)</h4><ul><li><strong>Treats:</strong> Narrow angles / angle-closure risk.</li><li><strong>Purpose / anatomy:</strong> YAG laser to create a small opening in the <strong>peripheral iris</strong> to relieve or prevent angle closure and lower IOP.</li><li><strong>Patient may experience:</strong> Brief light and clicking, mild discomfort.</li><li><strong>Technician preparation:</strong> Confirm the eye; these patients are <strong>not dilated, </strong>patients receive <strong>pilocarpine, after getting proparacaine</strong> &mdash; check before applying drops; set up the YAG laser; pre-procedure drops per protocol.</li><li><strong>Testing / post-procedure:</strong> anti-inflammatory drops; follow-up.</li><li><strong>Warning symptoms:</strong> Severe pain, vision loss, or high IOP.</li><li><strong>Coding:</strong> <strong>66761</strong>.</li></ul><h4 class=\"m-sub\">Panretinal Photocoagulation (PRP)</h4><ul><li><strong>Treats:</strong> Proliferative diabetic retinopathy and other ischemic retinal disease with neovascularization.</li><li><strong>Purpose / anatomy:</strong> Laser to the <strong>peripheral retina</strong> to reduce abnormal blood-vessel growth.</li><li><strong>Patient may experience:</strong> Bright flashes and some discomfort; possible temporary blur and reduced night or peripheral vision.</li><li><strong>Technician preparation:</strong> Dilation, confirm the eye; set up the laser; numbing per protocol.</li><li><strong>Post-procedure:</strong> Blurred vision for a while; follow-up.</li><li><strong>Warning symptoms:</strong> Sudden vision loss, new floaters, or a curtain (possible hemorrhage or detachment).</li><li><strong>Coding:</strong> commonly <strong>67228</strong> <em>(confirm with billing)</em>.</li></ul><h4 class=\"m-sub\">Micropulse Laser</h4><ul><li><strong>Treats:</strong> Some macular edema and selected glaucoma applications.</li><li><strong>Purpose / anatomy:</strong> Delivers laser in short pulses to treat while reducing tissue damage &mdash; targeting the <strong>macula/retina</strong> or <strong>trabecular meshwork</strong> depending on the application.</li><li><strong>Patient may experience:</strong> Usually well tolerated.</li><li><strong>Technician preparation:</strong> Per application (visual acuity, OCT or IOP), consent, and setup.</li><li><strong>Coding:</strong> varies by clinic and payer <em>(confirm with billing)</em>.</li></ul><h3 class=\"m-sec\">Injection and Surgical Procedures</h3><h4 class=\"m-sub\">Intravitreal Injection</h4><ul><li><strong>Treats:</strong> Wet AMD, diabetic macular edema, retinal vein occlusion.</li><li><strong>Purpose / anatomy:</strong> Inject medication (anti-VEGF or steroid) into the <strong>vitreous cavity</strong>. The drug itself is billed separately with a J-code.</li><li><strong>Patient may experience:</strong> Pressure, brief stinging, floaters afterward, and mild redness.</li><li><strong>Technician preparation:</strong> Confirm the eye and the drug, set up the injection tray, vision/IOP as directed, OCT often beforehand, consent, and antiseptic prep per protocol.</li><li><strong>Post-procedure:</strong> Avoid rubbing the eye; watch for warning symptoms; follow-up.</li><li><strong>Warning symptoms:</strong> Increasing pain, redness, or vision loss (possible infection / endophthalmitis) &mdash; escalate promptly.</li><li><strong>Coding:</strong> <strong>67028</strong> (drug billed separately).</li></ul><h4 class=\"m-sub\">YAG Posterior Capsulotomy</h4><ul><li><strong>Treats:</strong> Posterior capsular opacification (\"secondary cataract\") after cataract surgery.</li><li><strong>Purpose / anatomy:</strong> Laser opening in the cloudy <strong>posterior lens capsule</strong> (behind the IOL) to restore clear vision.</li><li><strong>Patient may experience:</strong> Brief flashes and floaters afterward; painless.</li><li><strong>Technician preparation:</strong> Visual acuity, IOP, dilation (often), confirm the eye, set up the YAG laser.</li><li><strong>Post-procedure:</strong> IOP check; follow-up.</li><li><strong>Warning symptoms:</strong> New flashes or a curtain (rare retinal issues) or high IOP.</li><li><strong>Coding:</strong> commonly <strong>66821</strong> <em>(confirm with billing)</em>.</li></ul><h4 class=\"m-sub\">Cataract Surgery (Extraction with IOL)</h4><ul><li><strong>Treats:</strong> A visually significant cataract.</li><li><strong>Purpose / anatomy:</strong> Remove the cloudy <strong>crystalline lens</strong> and implant an intraocular lens (IOL).</li><li><strong>Patient may experience:</strong> Done in the OR; mild post-op scratchiness and light sensitivity.</li><li><strong>Technician preparation (pre-op):</strong> Biometry (92136), measurements, confirm the target/lens plan; post-op visual acuity and IOP.</li><li><strong>Post-procedure:</strong> Drops (antibiotic, steroid/NSAID), an eye shield, and activity limits; 1-day, 1-week, and 1-month follow-ups.</li><li><strong>Warning symptoms:</strong> Increasing pain, vision loss, or flashes/curtain &mdash; escalate.</li><li><strong>Coding:</strong> <strong>66984</strong> (66982 is the complex version).</li></ul><h4 class=\"m-sub\">Blepharoplasty</h4><ul><li><strong>Treats:</strong> Excess or drooping eyelid skin (functional or cosmetic); related ptosis repair.</li><li><strong>Purpose / anatomy:</strong> Remove or reposition <strong>eyelid</strong> tissue to improve function or appearance.</li><li><strong>Patient may experience:</strong> Bruising and swelling afterward.</li><li><strong>Technician preparation:</strong> Visual acuity, external photos, and a visual field for functional cases (documenting superior-field obstruction).</li><li><strong>Coding:</strong> varies &mdash; functional (e.g., ptosis repair <strong>67904</strong>) vs cosmetic (e.g., <strong>15822/15823</strong>) <em>(confirm with billing)</em>.</li></ul><h4 class=\"m-sub\">M&uuml;llerectomy (M&uuml;ller's Muscle&ndash;Conjunctival Resection, MMCR)</h4><ul><li><strong>Treats:</strong> Mild upper-eyelid ptosis (drooping), typically when the lid lifts in response to a phenylephrine test. Ptosis is sometimes noticed after other eye surgery, such as cataract surgery.</li><li><strong>Purpose / anatomy:</strong> Removes a small strip of <strong>M&uuml;ller's muscle and conjunctiva</strong> from the inner (posterior) surface of the upper eyelid to raise the lid.</li><li><strong>Patient may experience:</strong> Sutures on the inner eyelid that are removed at a later visit; mild swelling, bruising, or irritation afterward.</li><li><strong>Technician preparation:</strong> Visual acuity, external photos, and a visual field for functional cases (documenting superior-field obstruction); a <strong>phenylephrine (eyedrop) test</strong> may be done to confirm candidacy.</li><li><strong>Testing / post-procedure:</strong> Suture removal at a follow-up visit; lubrication and activity guidance per protocol.</li><li><strong>Warning symptoms:</strong> Significant pain, vision loss, worsening droop, or signs of infection &mdash; escalate.</li><li><strong>Coding:</strong> ptosis-repair coding varies (e.g., <strong>67908</strong>, conjunctivo-tarso-M&uuml;ller's muscle&ndash;levator resection) <em>(confirm with billing)</em>.</li></ul><div class=\"callout callout--key\"><h4 class=\"callout__title\">Key takeaways</h4><ul><li>Procedures are introduced after the related disease and testing are understood.</li><li>Lasers (SLT, LPI, PRP) and injections are office-based; cataract surgery, keratoplasty, and blepharoplasty are surgical.</li><li>The technician's role centers on preparation, required testing, consent and logistics, and post-procedure education &mdash; following clinic protocol.</li><li>Increasing pain, vision loss, or new floaters/curtain after any procedure require prompt escalation.</li></ul></div><div class=\"callout callout--check\"><h4 class=\"callout__title\">Knowledge check</h4><ul><li>Match each procedure to the condition it treats and the anatomy involved.</li><li>List the technician preparation steps for a given procedure.</li><li>Identify the warning symptoms that require escalation after a procedure.</li><li>Match each procedure to its CPT code where applicable.</li></ul></div>"},
        {num:"1.8", title:"Final Assessment", topic:"", body:"<p class=\"lead\">This assessment checks understanding across all of Lesson 1 before moving on. It is a knowledge check, not a clinical qualification.</p><h3 class=\"m-sec\">Part 1 &mdash; Anatomy Labeling</h3><ul><li>Label the major <strong>external</strong> structures: eyelids, lashes, conjunctiva, sclera, cornea, tear film, lacrimal system, extraocular muscles.</li><li>Label the major <strong>anterior segment</strong> structures: anterior chamber, iris, pupil, angle, ciliary body, lens.</li><li>Label the major <strong>posterior segment</strong> structures: vitreous, retina, macula, fovea, optic disc, optic nerve, choroid, retinal vessels.</li><li>For each, state whether it belongs to the external eye, anterior segment, or posterior segment.</li></ul><h3 class=\"m-sec\">Part 2 &mdash; Multiple Choice (sample)</h3><ol><li>Which structure provides most of the eye's focusing power along with the lens? <em>(a) Sclera (b) Cornea (c) Choroid (d) Iris</em></li><li>A patient reports a curtain coming down over their vision. This is most concerning for: <em>(a) Dry eye (b) Cataract (c) Retinal detachment (d) Blepharitis</em></li><li>Which condition is usually painless and asymptomatic until advanced? <em>(a) Corneal abrasion (b) Acute angle closure (c) Primary open-angle glaucoma (d) Conjunctivitis</em></li><li>Which test measures corneal thickness? <em>(a) Gonioscopy (b) Pachymetry (c) OCT macula (d) Amsler grid)</em></li><li>Refraction (92015) is: <em>(a) Always covered by Medicare (b) A test of eye pressure (c) Often paid out of pocket (d) A retinal photo)</em></li></ol><div class=\"callout callout--eg\"><h4 class=\"callout__title\">Answer key</h4><p>**** 1-b &middot; 2-c &middot; 3-c &middot; 4-b &middot; 5-c</p></div><h3 class=\"m-sec\">Part 3 &mdash; Disease-to-Test Matching</h3><p>Match each condition with a commonly ordered test: <strong>Glaucoma</strong>, <strong>Diabetic macular edema</strong>, <strong>AMD</strong>, <strong>Narrow angles</strong>, <strong>Cataract (surgical planning)</strong>.</p><blockquote><strong>Suggested answers:</strong> glaucoma &rarr; OCT nerve / visual field &middot; DME &rarr; OCT macula &middot; AMD &rarr; Amsler grid / OCT macula &middot; narrow angles &rarr; gonioscopy &middot; cataract planning &rarr; biometry.</blockquote><h3 class=\"m-sec\">Part 4 &mdash; Instrument Identification</h3><ul><li>Given an instrument or its description, name it and state what it evaluates (e.g., \"measures eye pressure by flattening the cornea\" &rarr; Goldmann applanation tonometer).</li><li>Identify whether the instrument measures <strong>structure</strong> or <strong>function</strong>.</li></ul><h3 class=\"m-sec\">Part 5 &mdash; CPT Code Matching</h3><p>Match each code to its test or service: <strong>92015, 76514, 92020, 92083, 92133, 92134, 92250, 92235, 92025, 92136</strong>.</p><h3 class=\"m-sec\">Part 6 &mdash; Patient Scenarios</h3><p>For each scenario, identify the likely chief complaint, the questions to ask, and whether it is <strong>routine or urgent</strong>:</p><ul><li>A diabetic patient here for a yearly eye exam with no new symptoms.</li><li>A patient with sudden flashes and a shower of new floaters.</li><li>A patient with gradual blurry vision and glare at night.</li><li>A patient with a red, painful eye and light sensitivity.</li><li>A patient here for a 1-week post-cataract-surgery check.</li></ul><h3 class=\"m-sec\">Escalation Check</h3><ul><li>List the symptoms that require prompt escalation regardless of the scheduled reason for visit.</li></ul><p><em>This completes Lesson 1. Lesson 2 covers Patient Interviewing and Charting.</em></p>"}
      ]
    },
    {
      id:"m2", label:"Module 2", title:"Charting the HPI",
      status:"available",
      desc:"The charting matrix — the basic chart format for each chief complaint, plus reading the TAR to know why the patient is back.",
      overview:
        '<p class="lead">Most returning patients come back for a small set of recognizable reasons. This module teaches the <strong>charting matrix</strong>: the fixed set of HPI fields you complete for every returning patient, and the basic “starter” format each common chief complaint follows.</p>'+
        '<p>Charting starts before the patient is in the room. The reason the visit was scheduled &mdash; and the codes on the <strong>TAR</strong> (the visit&rsquo;s authorization / order sheet listing the exam code and the testing codes ordered) &mdash; usually tell you why the patient is back and what to set up. Your job is to recognize the pattern, complete the matrix accurately, and flag anything urgent.</p>'+
        '<h4>Common reasons patients come back</h4>'+
        UL([
          "<strong>Dry Eyes</strong> &mdash; ongoing surface irritation, tears or drops management (incl. punctal plugs)",
          "<strong>Glaucoma / Glaucoma Suspect</strong> &mdash; IOP checks and glaucoma testing",
          "<strong>Diabetic Eye Exam &amp; Retinopathy</strong> &mdash; dilated exam / fundus photos; diabetic retina conditions (DME, PDR, NPDR)",
          "<strong>Macular, Retina &amp; Injection Follow-Up</strong> &mdash; AMD, vein occlusion (BRVO/CRVO), and diabetic injections",
          "<strong>Cataract &amp; Blurry Vision</strong> &mdash; gradual blur, glare, cloudiness",
          "<strong>Post-Op</strong> &mdash; 1-day / 1-week checks after surgery",
          "<strong>Floaters &amp; Flashes</strong> &mdash; new spots or flashes in the vision"
        ])+
        '<p>There is no required order &mdash; use the lesson list to jump to whichever chief complaint you need. Every template here mirrors the clinic&rsquo;s <strong>Charting Reference</strong>; when in doubt, follow clinic convention and ask.</p>'+
        '<div class="callout callout--key"><h4 class="callout__title">Learning objectives</h4>'+
        '<p style="margin:0 0 .7em;color:var(--ink-2)">By the end of this module, the trainee should be able to:</p>'+
        UL([
          "Name the HPI charting fields and the order they are charted in.",
          "Complete the basic chart format for each common chief complaint.",
          "Choose the correct “Reason for Exam” wording for the visit type.",
          "Recognize associated-symptom vocabulary and chart it correctly.",
          "Read a TAR and distinguish exam codes from testing codes.",
          "Use the ordered tests to infer what the patient is here for.",
          "Recognize symptoms (e.g. flashes) that require prompt escalation regardless of the scheduled reason."
        ])+'</div>',
      lessons:[
        {
          num:"2.1", title:"The HPI Charting Matrix", topic:"The fixed format behind every chief complaint",
          body:
            '<p class="lead">The <abbr title="History of Present Illness">HPI</abbr> is the heart of the chart. Once you know the matrix, every chief complaint becomes a fill-in-the-blank exercise.</p>'+
            '<p>Chart every visit in two steps. First set the <strong>Reason for Visit</strong> (the diagnosis). Then write the HPI using these fields, <strong>always in this order</strong>:</p>'+
            OL([
              "<strong>CC</strong> &mdash; the chief complaint (e.g. “Dry Eyes OU”)",
              "<strong>Since Last Visit</strong> &mdash; worsening / no changes noted / stable / new",
              "<strong>Context Onset/Aggravation</strong> &mdash; what brings it on (often “nothing specific noted”)",
              "<strong>Severity</strong> &mdash; mild / moderate / severe (or a disease-specific value)",
              "<strong>Associated Symptoms</strong> &mdash; from the vocabulary below, or “none”",
              "<strong>Duration of Problem</strong> &mdash; how long (“patient unsure,” “many years,” a number)",
              "<strong>Modifying Factors</strong> &mdash; drops, tears, glasses; what helps or is being used",
              "<strong>Reason for Exam</strong> &mdash; why they are here today (drives what you set up)"
            ])+
            '<h3>Laterality shorthand</h3>'+
            UL([
              "<strong>OU</strong> &mdash; both eyes &middot; <strong>OD</strong> &mdash; right eye &middot; <strong>OS</strong> &mdash; left eye",
              "<strong>OD &gt; OS</strong> means the right eye is more affected than the left (and vice-versa)."
            ])+
            '<h3>Associated-symptom vocabulary</h3>'+
            '<p>Chart associated symptoms using the clinic&rsquo;s standard terms:</p>'+
            UL([
              "<em>blurry, cloudy</em> &mdash; vision quality",
              "<em>tearing, fbs</em> (foreign-body sensation)<em>, itchy, irritation, eye pain</em> &mdash; surface / comfort",
              "<em>floaters, flashes, curtain/veil/shadow</em> &mdash; retina / vitreous",
              "<em>light sensitivity</em> &mdash; glare / photophobia"
            ])+
            WARN("Escalate: flashes","<p style=\"margin:0\">If a patient reports <strong>flashes</strong> &mdash; or new floaters with a curtain/shadow &mdash; make sure the physician knows and the patient is set up to be <strong>dilated</strong>. This overrides whatever the visit was originally scheduled for.</p>")+
            KT([
              "Reason for Visit (diagnosis) first, then the HPI fields in order.",
              "The field order never changes; only the entries change per patient.",
              "Most fields have a small set of standard answers &mdash; learn the defaults per CC.",
              "Flashes / new floaters with a curtain always get escalated and dilated."
            ])
        },
        {
          num:"2.2", title:"Dry Eyes", topic:"Dry Eyes OU and punctal plugs",
          body:
            '<p class="lead">Dry eye is one of the most common return visits. The surface symptoms &mdash; fbs, tearing, irritation &mdash; and what the patient is using to manage them drive the chart.</p>'+
            MATRIX("Dry Eyes OU",[
              ["Since Last Visit","no changes noted"],
              ["Context Onset/Aggravation","nothing specific noted"],
              ["Severity","mild"],
              ["Associated Symptoms","fbs; tearing"],
              ["Duration of Problem","patient unsure / many years"],
              ["Modifying Factors","artificial tears help"],
              ["Reason for Exam","Here for Further Evaluation and Management"]
            ])+
            '<h3>Punctal plugs</h3>'+
            '<p>Patients treated with punctal plugs still chart under <strong>Dry Eyes</strong> &mdash; the difference is mainly Modifying Factors and Reason for Exam:</p>'+
            MATRIX("Dry Eyes (punctal plugs)",[
              ["Since Last Visit","worsening"],
              ["Context Onset/Aggravation","all the time"],
              ["Severity","mild / moderate"],
              ["Associated Symptoms","fbs; tearing; irritation"],
              ["Duration of Problem","many years"],
              ["Modifying Factors","artificial tears do not help &nbsp;<em>(if taking artificial tears)</em> / taking drops as prescribed &nbsp;<em>(if prescribed eye drops)</em>"],
              ["Reason for Exam","Here for Treatment and Further Evaluation and Management"]
            ])+

  /* ---- progress persistence (guarded) ---- */
  var STORE = "ophthal-training-v1";
  var progress = load();
  function load(){ try{ return JSON.parse(localStorage.getItem(STORE))||{}; }catch(e){ return {}; } }
  function save(){ try{ localStorage.setItem(STORE, JSON.stringify(progress)); }catch(e){} }
  function seen(mid,i){ return !!(progress[mid] && progress[mid].lessons && progress[mid].lessons.indexOf(i)>-1); }
  function markSeen(mid,i){
    if(!progress[mid]) progress[mid]={lessons:[],done:false};
    if(progress[mid].lessons.indexOf(i)<0){ progress[mid].lessons.push(i); save(); }
  }
  function markDone(mid){ if(!progress[mid]) progress[mid]={lessons:[],done:false}; progress[mid].done=true; save(); }
  function isDone(mid){ return !!(progress[mid] && progress[mid].done); }
  function savePos(){ try{ localStorage.setItem(STORE+"-pos", JSON.stringify({v:state.view,m:state.m,p:state.p})); }catch(e){} }
  function loadPos(){ try{ return JSON.parse(localStorage.getItem(STORE+"-pos")); }catch(e){ return null; } }

  function isAnatomyLesson(){
    if(state.view!=="module") return false;
    var mod=MODULES[state.m]; if(!mod||mod.id!=="m1") return false;
    if(state.p<1||state.p>mod.lessons.length) return false;
    return mod.lessons[state.p-1].num==="1.2";
  }
  function isAssessmentLesson(){
    if(state.view!=="module") return false;
    var mod=MODULES[state.m]; if(!mod||mod.id!=="m2") return false;
    if(state.p<1||state.p>mod.lessons.length) return false;
    return /assessment/i.test(mod.lessons[state.p-1].title);
  }
  function enhanceAssessment(){
    var qs=stage.querySelectorAll(".q"); if(!qs.length) return;
    Array.prototype.forEach.call(qs,function(q){
      var fb=q.querySelector(".q__fb");
      var opts=q.querySelectorAll(".opt");
      Array.prototype.forEach.call(opts,function(o){
        o.addEventListener("click",function(){
          if(q.getAttribute("data-done")==="1") return;
          var correct=o.getAttribute("data-correct")==="1";
          if(correct){
            q.setAttribute("data-done","1");
            o.setAttribute("data-state","correct");
            Array.prototype.forEach.call(opts,function(x){ x.disabled=true; });
            if(fb){ fb.textContent=o.getAttribute("data-fb")||"Correct."; fb.className="q__fb ok"; }
          } else {
            o.setAttribute("data-state","wrong"); o.disabled=true;
            if(fb){ fb.textContent=o.getAttribute("data-fb")||"Not quite — try again."; fb.className="q__fb no"; }
          }
        });
      });
    });
  }
  function enhanceAnatomy(){
    var sec=stage.querySelector("section"); if(!sec) return;
    var wrap=document.createElement("div"); wrap.innerHTML=ANATOMY_FIG;
    var fig=wrap.firstChild;
    var firstSec=sec.querySelector(".prose .m-sec");
    if(firstSec){ firstSec.parentNode.insertBefore(fig, firstSec); }
    else { sec.appendChild(fig); }
    var tw=document.createElement("div"); tw.className="totop-wrap";
    tw.innerHTML='<button class="btn btn--ghost" data-nav="totop">'+ICON.up+' Back to top</button>';
    sec.appendChild(tw);
  }
  var floatTop=document.getElementById("floatTop"), onAnatomy=false;
  function updateFloat(){
    if(onAnatomy && window.pageYOffset>360){ floatTop.classList.add("show"); }
    else { floatTop.classList.remove("show"); }
  }
  function animateScroll(toY){
    toY=Math.max(0, toY);
    if(reduce || document.hidden){ window.scrollTo(0, toY); return; }
    var startY=window.pageYOffset, dist=toY-startY;
    if(Math.abs(dist)<2){ window.scrollTo(0, toY); return; }
    var dur=Math.min(900, Math.max(350, Math.abs(dist)*0.25)), t0=null;
    function step(ts){
      if(t0===null) t0=ts;
      var p=Math.min(1,(ts-t0)/dur);
      var e=p<0.5?2*p*p:1-Math.pow(-2*p+2,2)/2;   // easeInOutQuad
      window.scrollTo(0, startY+dist*e);
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  function scrollToAnatomy(kw){
    if(!kw) return; kw=kw.toLowerCase();
    var hs=stage.querySelectorAll(".m-sec, .m-sub"), target=null;
    for(var i=0;i<hs.length;i++){ if(hs[i].textContent.toLowerCase().indexOf(kw)>-1){ target=hs[i]; break; } }
    if(!target) return;
    var y=target.getBoundingClientRect().top+window.pageYOffset-84;
    animateScroll(y);
    target.classList.remove("flash"); void target.offsetWidth; target.classList.add("flash");
    setTimeout(function(){ target.classList.remove("flash"); }, 1700);
  }
  function scrollTopSmooth(){ animateScroll(0); }
